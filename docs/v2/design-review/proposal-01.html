<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adams connector — Astra design proposal 01</title></head><body style="margin:0">
<div id="adams-design">
<style>
#adams-design{--ad-bg:light-dark(#f5f6f8,#1b2025);--ad-panel:light-dark(#fff,#242b32);--ad-ink:light-dark(#202830,#eef1f5);--ad-muted:light-dark(#586574,#b2bdc9);--ad-line:light-dark(#dce1e7,#424d59);--ad-purple:light-dark(#714b67,#d6b1cb);--ad-tint:light-dark(#f1eaf0,#3b303b);--ad-warn:light-dark(#80560e,#f4d296);--ad-warm:light-dark(#fff6e6,#3f3525);--ad-green:light-dark(#226545,#a3debb);--ad-soft:light-dark(#eaf5ee,#243d30);font-family:Arial,sans-serif;color:var(--ad-ink);background:var(--ad-bg);font-size:14px;line-height:1.5;border:1px solid var(--ad-line);border-radius:10px;overflow:hidden;color-scheme:light dark}
#adams-design *{box-sizing:border-box}#adams-design button,#adams-design select,#adams-design input{font:inherit;color:inherit}#adams-design button{cursor:pointer;border:1px solid var(--ad-line);border-radius:5px;padding:8px 13px;background:var(--ad-panel);font-weight:500}#adams-design button:hover{border-color:var(--ad-purple);background:var(--ad-tint)}#adams-design button.primary{background:var(--ad-purple);color:light-dark(#fff,#241c22);border-color:var(--ad-purple)}#adams-design button:disabled{opacity:.45;cursor:not-allowed}#adams-design .text-button{border:0;color:var(--ad-purple);background:transparent;padding:4px 0;text-align:start}#adams-design .bar{background:var(--ad-panel);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--ad-line)}#adams-design .brand{font-weight:500;font-size:18px;letter-spacing:-.5px}#adams-design .brand span{color:var(--ad-purple)}#adams-design .quiet{color:var(--ad-muted);font-size:12px}#adams-design .spacer{flex:1}#adams-design select,#adams-design input{background:var(--ad-panel);border:1px solid var(--ad-line);padding:8px;border-radius:5px;max-width:100%;min-width:0}#adams-design .review{padding:7px 20px;background:var(--ad-tint);color:var(--ad-purple);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}#adams-design nav{background:var(--ad-panel);display:flex;flex-wrap:wrap;gap:2px;padding:8px 16px;border-bottom:1px solid var(--ad-line)}#adams-design nav button{border:0;background:transparent;padding:8px 10px;color:var(--ad-muted)}#adams-design nav button[aria-current=page]{background:var(--ad-tint);color:var(--ad-purple)}#adams-design main{padding:24px;min-height:530px}#adams-design h1{font-size:25px;line-height:1.2;font-weight:500;letter-spacing:-.7px;margin:0 0 8px}#adams-design h2{font-size:17px;font-weight:500;margin:0 0 8px}#adams-design h3{font-size:14px;font-weight:500;margin:0 0 6px}#adams-design p{margin:0 0 12px}#adams-design .heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}#adams-design .heading p{color:var(--ad-muted);margin:0}#adams-design .panel{background:var(--ad-panel);border:1px solid var(--ad-line);border-radius:7px;padding:20px;margin-bottom:16px}#adams-design .attention{background:var(--ad-warm);border-color:var(--ad-line)}#adams-design .good{background:var(--ad-soft);color:var(--ad-green)}#adams-design .row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--ad-line);flex-wrap:wrap}#adams-design .row:last-child{border:0;padding-bottom:0}#adams-design .row:first-child{padding-top:0}#adams-design .row p{margin:3px 0 0;color:var(--ad-muted);font-size:12px}#adams-design .row strong{font-weight:500}#adams-design .pill{display:inline-block;border-radius:4px;padding:3px 7px;font-size:12px;background:var(--ad-tint);color:var(--ad-purple)}#adams-design .warn{background:var(--ad-warm);color:var(--ad-warn)}#adams-design .success{background:var(--ad-soft);color:var(--ad-green)}#adams-design .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}#adams-design .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}#adams-design .table{width:100%;border-collapse:collapse}#adams-design th{text-align:start;color:var(--ad-muted);font-size:12px;font-weight:500;background:var(--ad-bg)}#adams-design th,#adams-design td{padding:12px 10px;border-bottom:1px solid var(--ad-line);vertical-align:top}#adams-design td small{display:block;color:var(--ad-muted);font-size:12px}#adams-design .scroll{overflow:auto}#adams-design .steps{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px;color:var(--ad-muted);font-size:12px}#adams-design .step{padding:7px 10px;border-radius:4px;background:var(--ad-panel)}#adams-design .step.active{background:var(--ad-tint);color:var(--ad-purple)}#adams-design .field{display:grid;gap:5px;margin:15px 0;max-width:480px}#adams-design .field small{color:var(--ad-muted)}#adams-design .choice{display:block;padding:14px;border:1px solid var(--ad-line);border-radius:5px;margin:10px 0;background:var(--ad-panel)}#adams-design .choice input{margin-inline-end:8px}#adams-design .timeline{padding-inline-start:22px;margin:10px 0}#adams-design .timeline li{padding:4px 0 16px}#adams-design .timeline span{display:block;color:var(--ad-muted);font-size:12px}#adams-design details{margin-top:16px}#adams-design summary{cursor:pointer;color:var(--ad-purple)}#adams-design .result{margin-bottom:16px;padding:12px 16px;background:var(--ad-soft);color:var(--ad-green);border-radius:5px}#adams-design .back{margin-bottom:18px}#adams-design .footer{padding:12px 20px;border-top:1px solid var(--ad-line);display:flex;gap:12px;flex-wrap:wrap;color:var(--ad-muted);font-size:12px;background:var(--ad-panel)}#adams-design .snapshot{font-size:12px;color:var(--ad-muted);margin-top:12px}#adams-design .change{color:var(--ad-purple);font-weight:500}#adams-design .divider{border-top:1px solid var(--ad-line);margin:16px 0}#adams-design .count{font-variant-numeric:tabular-nums}#adams-design [hidden]{display:none!important}
@media(max-width:650px){#adams-design main{padding:16px;min-height:0}#adams-design .grid{grid-template-columns:1fr}#adams-design .bar{padding:12px;gap:10px}#adams-design nav{padding:8px}#adams-design nav button{padding:8px}#adams-design .panel{padding:15px}#adams-design .optional{display:none}#adams-design h1{font-size:22px}#adams-design .heading{align-items:flex-start}#adams-design td,#adams-design th{padding:10px 6px}#adams-design .row{gap:8px}#adams-design select{max-width:215px}}
@media(pointer:coarse){#adams-design button,#adams-design select,#adams-design input{min-height:44px}#adams-design input[type=checkbox],#adams-design input[type=radio]{min-height:auto}#adams-design input,#adams-design select{font-size:16px}}
</style>
<div class="review"><span>Astra design proposal · 01</span><span class="spacer"></span><span>Interactive sample data · No store changes</span></div>
<header class="bar"><div class="brand"><span>odoo</span> / Shopify</div><span class="spacer"></span><label><span class="quiet">Store </span><select id="ad-store" aria-label="Store"><option value="active">Adams · Demo</option><option value="setup">New store · Setup</option></select></label><span class="quiet optional">Adams Trading · Administrator</span></header>
<nav aria-label="Connector navigation" id="ad-nav"></nav>
<main id="ad-main"></main>
<footer class="footer"><span>Sample snapshot · 8 Sep 2026, 10:42 GST</span><span class="spacer"></span><button class="text-button" id="ad-reset">Restart walkthrough</button></footer>
<script>
(()=>{
const root=document.getElementById('adams-design');
const main=root.querySelector('#ad-main');
const nav=root.querySelector('#ad-nav');
let page='Overview',stage=0,matched=false,stock=false,verified=false,exported=false,paused=false,notice='';
const pages=['Overview','Needs Attention','Products','Orders','Inventory','Fulfillment','Runs','Settings'];
const b=(label,action,primary=false)=>`<button class="${primary?'primary':''}" data-action="${action}">${label}</button>`;
const tag=(label,type='')=>`<span class="pill ${type}">${label}</span>`;
const count=()=>Number(!matched)+Number(!stock)+Number(!verified);
const title=(head,sub,action='')=>`<div class="heading"><div><h1>${head}</h1><p>${sub}</p></div>${action}</div>`;
const row=(head,sub,status,action='')=>`<div class="row"><div><strong>${head}</strong><p>${sub}</p></div><span class="spacer"></span>${status}${action}</div>`;
const table=(heads,rows)=>`<div class="scroll"><table class="table"><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function draw(){
root.querySelector('#ad-store').value=(page==='Setup'||page==='Activated')?'setup':'active';
nav.innerHTML=pages.map(p=>`<button data-page="${p}" ${page===p?'aria-current="page"':''}>${p}${p==='Needs Attention'&&count()?` · ${count()}`:''}</button>`).join('');
let html='';
if(page==='Overview')html=title('Your store, at a glance','Adams · Shopify ↔ Odoo',b('Check connection','connection'))+
`<section class="panel ${count()?'attention':'good'}"><h2>${paused?'Sync is paused':count()?`${count()} decisions need your attention`:'No open exceptions'}</h2><p>${paused?'New work is paused. Previously completed work and history are preserved.':count()?'Orders, stock and one shipment need a decision. Other eligible work can continue.':'All sample decisions are resolved. Each outcome is recorded below.'}</p>${count()?b('Review next issue',!matched?'match':!stock?'stock':'verify',true):''}</section>`+
`<div class="grid"><section class="panel"><h2>Workflow status</h2>${row('Orders','Shopify → Odoo · Received through 10:42',tag(matched?'Up to date':'1 order held',matched?'success':'warn'),b('Open','orders'))}${row('Inventory','Odoo → Shopify · Observed 10:41',tag(stock?'Confirmed':'First push held',stock?'success':'warn'),b('Open','inventory'))}${row('Products','Linked catalog · Checked 10:40',tag(exported?'Update confirmed':'Up to date','success'),b('Open','products'))}${row('Fulfillment','Odoo → Shopify · Last attempt 10:37',tag(verified?'Confirmed':'Needs verification',verified?'success':'warn'),b('Open','fulfillment'))}</section><section class="panel"><h2>Recent activity</h2><ol class="timeline"><li>Order #1047 imported<span>10:42 · Odoo S0047 · Totals matched</span></li><li>Product scan finished<span>10:40 · 24 products checked</span></li><li>${verified?'Shipment confirmed in Shopify':'Shipment response interrupted'}<span>10:37 · #1045 · ${verified?'Existing fulfillment linked':'Remote outcome unknown'}</span></li></ol>${b('View run history','runs')}</section></div>`;
if(page==='Needs Attention')html=title('Needs Attention','Resolve the cause, review the consequence, then continue.')+`<section class="panel">${!matched?row('Choose the correct product','Order #1048 is held · Linen shirt / Sand / M · 12 minutes',tag('Administrator · Review','warn'),b('Review match','match',true)):''}${!stock?row('Approve the first stock update','2 inventory levels · Dubai warehouse → Online store',tag('Administrator · Approval','warn'),b('Preview quantities','stock')):''}${!verified?row('Verify a shipment already sent','Order #1045 · The request ended before a response arrived',tag('Administrator · Verify','warn'),b('Check Shopify','verify')):''}${!count()?'<h2>No open exceptions</h2><p>Resolved decisions remain available in Runs.</p>'+b('View history','runs'):''}</section>`;
if(page==='Products')html=title('Products','Linked records, field ownership and controlled updates.')+`<section class="panel">${table(['Product','Connection','Next action'],[['Linen shirt<small>Sand / M · LS-SND-M</small>',tag(matched?'Linked':'Review match',matched?'success':'warn'),b(matched?'View order':'Review match',matched?'order':'match')],['Everyday tee<small>White / L · ET-WHT-L</small>',tag(exported?'Confirmed':'2 field changes',exported?'success':''),b('Review update','diff')],['Canvas tote<small>Natural · CT-NAT</small>',tag('Up to date','success'),'Checked 10:40']])}</section>`;
if(page==='Orders')html=title('Orders','Follow each order from Shopify receipt to its Odoo record.')+`<section class="panel">${table(['Order','Amount','Result',''],[['#1048<small>Received 10:30</small>','AED 189.00',tag(matched?'Imported · S0048':'Held · Product match',matched?'success':'warn'),b('Open order','order')],['#1047<small>Received 10:42</small>','AED 249.00',tag('Imported · S0047','success'),'Totals matched'],['#1045<small>Received 09:15</small>','AED 120.00',tag(verified?'Shipment confirmed':'Shipment uncertain',verified?'success':'warn'),b('View shipment','verify')]])}</section>`;
if(page==='Inventory')html=title('Inventory','Odoo is the quantity source for the mapped location.')+`<section class="panel ${stock?'good':'attention'}"><h2>${stock?'2 inventory levels confirmed':'First update needs approval'}</h2><p>${stock?'Shopify readback matches the approved quantities.':'Review the exact quantities before publishing your first stock update.'}</p>${b(stock?'View confirmation':'Preview first update',stock?'runs':'stock',!stock)}</section><section class="panel"><h2>Location mapping</h2>${row('Dubai / Available to sell','Odoo warehouse · Dubai / Stock',tag('Mapped','success'))}${row('Online store','Shopify location · Dubai',tag(stock?'Active':'Awaiting first push',stock?'success':'warn'))}<p class="snapshot">Quantity = on hand minus reserved, under the configured stock policy.</p></section>`;
if(page==='Fulfillment')html=title('Fulfillment','Track delivery updates and confirm what Shopify received.')+`<section class="panel">${table(['Delivery','Tracking','Status',''],[['WH/OUT/0045<small>Shopify #1045 · Partial shipment</small>','DEMO-4451',tag(verified?'Confirmed':'Outcome unknown',verified?'success':'warn'),b('Review shipment','verify')]])}</section>`;
if(page==='Runs')html=title('Run history','What was requested, what changed, and what was verified.')+`<section class="panel">${row('Order import · #1048',matched?'Received → product linked → totals checked → S0048 created':'Received → ambiguous product → order held',tag(matched?'Completed':'Needs decision',matched?'success':'warn'),b('Open order','order'))}${row('Inventory · First update',stock?'Approved → sent → 2 levels confirmed by readback':'Preview prepared → awaiting approval',tag(stock?'Confirmed':'Awaiting approval',stock?'success':'warn'),b('View quantities','stock'))}${row('Fulfillment · #1045',verified?'Request interrupted → existing fulfillment found → binding saved':'Request interrupted → waiting for remote verification',tag(verified?'Confirmed':'Uncertain',verified?'success':'warn'),b('View evidence','verify'))}${exported?row('Product update · Everyday tee','2 fields approved → sent → values confirmed',tag('Confirmed','success')):''}</section><details class="panel"><summary>Administrator diagnostics</summary><p class="snapshot">The production view links redacted attempts, timing and configuration snapshots to this history. Technical detail stays behind this disclosure.</p></details>`;
if(page==='Settings')html=title('Store settings','Adams · Company: Adams Trading')+`<section class="panel">${row('Connection','Credentials stored securely through the approved connection flow.',tag('Connected','success'),b('Check connection','connection'))}${row('Setup and readiness','Resume configuration and review activation requirements.',tag('Configured','success'),b('Review setup','setup'))}${row('Sync admission',paused?'New work is paused. Resume preserves the existing policies.':'Enabled workflows admit eligible new work.',tag(paused?'Paused':'Active',paused?'warn':'success'),b(paused?'Resume sync':'Pause sync',paused?'resume':'pause'))}</section><section class="panel"><h2>Authority and automation</h2>${row('Orders','Shopify → Odoo · Currency and totals must reconcile.','')}${row('Stock','Odoo → Shopify · Mapped locations only.','')}${row('Product updates','Approved Odoo fields → Shopify · Other fields protected.','')}<p class="snapshot">Configuration changes require a fresh readiness check before affected work resumes.</p></section>`;
if(page==='Match')html=b('← Needs Attention','attention')+title('Which Odoo product is this?','Order #1048 · Entire order held until the product is linked.')+`<div class="grid"><section class="panel"><h2>Incoming from Shopify</h2>${row('Linen shirt','Sand / M','')}${row('SKU','LS-SND-M','')}${row('Barcode','No barcode supplied','')}<p class="snapshot">Two Odoo records use this SKU. A name or SKU alone cannot decide between them.</p></section><section class="panel"><h2>Choose the correct record</h2><label class="choice"><input type="radio" name="candidate" value="current">Linen shirt · Sand / M<br><span class="quiet">Current collection · Sales enabled · LS-SND-M</span></label><label class="choice"><input type="radio" name="candidate" value="old">Linen shirt · Sand / M (2024)<br><span class="quiet">Archived · Existing historical binding</span></label><p class="quiet">The archived candidate conflicts with an existing binding and cannot be selected for this link.</p></section></div><section class="panel"><h2>What happens next</h2><p>Link this Shopify variant to the selected Odoo product. Recheck and resume order #1048. Product fields and Shopify stock are unchanged.</p><div class="actions"><button class="primary" data-action="confirm-match" id="ad-confirm-match" disabled>Link product and recheck order</button>${b('Leave for later','attention')}</div></section>`;
if(page==='Order')html=b('← Orders','orders')+title('Shopify order #1048',matched?'Imported successfully · Odoo S0048':'Held for product matching',tag(matched?'Imported':'Action required',matched?'success':'warn'))+`<div class="grid"><section class="panel"><h2>Order checks</h2>${row('Customer','Exact existing customer binding',tag('Passed','success'))}${row('Product','Linen shirt / Sand / M',tag(matched?'Linked':'2 SKU candidates',matched?'success':'warn'))}${row('Currency and total','AED · Shopify 189.00 / Calculated 189.00',tag('Passed','success'))}</section><section class="panel"><h2>${matched?'Ready for your sales workflow':'Safe next step'}</h2><p>${matched?'Odoo order S0048 was created after every line and total passed validation.':'Choose the correct product. The whole order remains held; no partial Odoo order is created.'}</p>${b(matched?'View connector history':'Review product match',matched?'runs':'match',true)}</section></div>`;
if(page==='Stock')html=b('← Inventory','inventory')+title(stock?'Stock update confirmed':'Review the first stock update','Adams · Dubai / Available to sell → Shopify / Online store')+`<section class="panel">${table(['Variant','Shopify observed','Odoo available','Change'],[['Linen shirt · Sand / M','8','12','<span class="change">8 → 12 (+4)</span>'],['Everyday tee · White / L','5','3','<span class="change">5 → 3 (−2)</span>']])}<p class="snapshot">Sample preview · Observed 10:41 · Exactly 2 inventory levels at one location.</p></section><section class="panel"><h2>${stock?'Verified outcome':'Before you publish'}</h2><p>${stock?'Readback confirmed 12 and 3 available units in Shopify. The approval and result are linked in Runs.':'This changes the quantities customers can buy in Shopify. Odoo stock is unchanged. If either observed quantity changes before sending, the update stops for a new review.'}</p>${stock?b('View run history','runs'):b('Publish these 2 quantities','publish-stock',true)}</section>`;
if(page==='Verify')html=b('← Fulfillment','fulfillment')+title(verified?'Shipment confirmed':'Did Shopify receive this shipment?','Order #1045 · Odoo delivery WH/OUT/0045')+`<div class="grid"><section class="panel"><h2>Shipment evidence</h2>${row('Tracking','DEMO-4451','')}${row('Items sent','Canvas tote · 1 of 2 units','')}${row('Customer notification','Not requested','')}${row('Remote outcome',verified?'Exact matching fulfillment found':'Response interrupted after request was sent',tag(verified?'Confirmed':'Unknown',verified?'success':'warn'))}</section><section class="panel ${verified?'good':'attention'}"><h2>${verified?'Existing fulfillment linked':'Verify before sending again'}</h2><p>${verified?'The order, location, quantities and tracking match. The existing Shopify fulfillment is linked. No second shipment was created.':'The shipment may already exist in Shopify. Check the remote state first to avoid creating it twice.'}</p>${b(verified?'View run history':'Check Shopify for this shipment',verified?'runs':'verify-remote',true)}</section></div>`;
if(page==='Diff')html=b('← Products','products')+title('Review product changes','Everyday tee · White / L · ET-WHT-L')+`<section class="panel">${table(['Field','Shopify now','Proposed from Odoo'],[['Title','Everyday Tee','Everyday cotton tee'],['Price','AED 89.00','AED 95.00'],['Description','Managed in Shopify','Protected · Unchanged'],['Variants & media','Existing records','Preserved · No deletion']])}</section><section class="panel"><h2>${exported?'Changes confirmed':'One product · Two field changes'}</h2><p>${exported?'Shopify readback confirms the approved title and price.':'Only the title and price are owned by Odoo in this sample policy. A fresh validation is required if the product or policy changes before sending.'}</p>${b(exported?'View run history':'Confirm these 2 changes',exported?'runs':'export',true)}</section>`;
if(page==='Connection')html=title('Connection check','Adams · Sample result')+`<section class="panel good"><h2>Connection verified</h2><p>Credentials accepted and required permissions present for the enabled workflows.</p><p class="quiet">Checked 10:42 GST · No catalog or stock changes.</p>${b('Back to Overview','overview',true)}</section>`;
if(page==='Setup'){
const steps=['Connect','Workflows','Odoo defaults','Locations','Readiness','Activate'];
const bodies=[`<h2>Connect your Shopify store</h2><label class="field">Store name<input value="New store" aria-label="Store name"></label><label class="field">Shopify domain<input value="new-store.myshopify.com" aria-label="Shopify domain"><small>Use the permanent myshopify.com domain.</small></label><p class="quiet">This walkthrough simulates credential verification. Enter no real secrets.</p>`,
`<h2>Choose how this store will work</h2>${row('Orders & customers','Shopify → Odoo',tag('Enabled','success'))}${row('Inventory','Odoo → Shopify · First update requires approval',tag('Enabled','success'))}${row('Product updates','Only fields owned by Odoo',tag('Approval required'))}<p class="snapshot">Example policy. Production setup presents permitted workflow choices with their consequences.</p>`,
`<h2>Review Odoo defaults</h2>${row('Company','Adams Trading','')}${row('Warehouse','Dubai','')}${row('Sales currency','AED · Divergent-currency orders held for review','')}${row('Order policy','Validate all lines and totals before creation','')}`,
`<h2>Map the stock location</h2><label class="field">Shopify · Online store<select aria-label="Odoo location"><option>Dubai / Available to sell</option></select></label><p>Only this mapped location can receive stock updates. The first update needs a separate quantity preview.</p>`,
`<h2>Readiness checks</h2>${row('Connection and permissions','Credentials accepted for enabled workflows',tag('Passed','success'))}${row('Odoo defaults','Company, currency and order policy valid',tag('Passed','success'))}${row('Location mapping','One explicit source and destination',tag('Passed','success'))}${row('Initial stock','Quantity approval follows activation',tag('Separate approval'))}`,
`<h2>Ready to activate this store</h2><p>Order import can start under the reviewed policy. Stock publishing stays held until its first quantity preview is approved.</p>${row('Store','New store · new-store.myshopify.com','')}${row('Company','Adams Trading','')}<p class="snapshot">Activation changes this store only. Existing stores keep their current settings.</p>`];
html=title('Set up your store',`Step ${stage+1} of 6 · Draft retained during this walkthrough`)+`<div class="steps">${steps.map((x,i)=>`<span class="step ${i===stage?'active':''}">${i+1}. ${x}</span>`).join('')}</div><section class="panel">${bodies[stage]}<div class="actions">${stage?b('Back','setup-back'):''}${b(stage===0?'Verify and continue':stage===5?'Activate store':'Continue',stage===5?'activate':'setup-next',true)}${b('Save and exit','exit-setup')}</div></section>`;
}
if(page==='Activated')html=title('Your new store is active','Readiness checks passed in this sample walkthrough.')+`<section class="panel good"><h2>Next: review the first inventory update</h2><p>Activation has not published stock. The first update requires its own quantity preview and approval.</p>${b('Return to demo store','overview',true)}</section>`;
if(page==='Pause')html=title('Pause new sync work?','Adams · Enabled workflows')+`<section class="panel"><p>New work will stop being admitted. A remote request already sent may still finish and require verification. History and bindings remain available.</p><div class="actions">${b('Pause new work','confirm-pause',true)}${b('Keep running','settings')}</div></section>`;
main.innerHTML=(notice?`<div class="result" role="status">${notice}</div>`:'')+html;
if(paused) main.querySelectorAll('[data-action=confirm-match],[data-action=publish-stock],[data-action=export]').forEach(button=>{button.disabled=true;button.title='Resume sync in Settings before starting new work.';});
notice='';
}
root.addEventListener('click',e=>{
const button=e.target.closest('button');if(!button)return;
if(button.dataset.page){page=button.dataset.page;draw();return;}
const a=button.dataset.action;
const routes={overview:'Overview',attention:'Needs Attention',products:'Products',orders:'Orders',inventory:'Inventory',fulfillment:'Fulfillment',runs:'Runs',settings:'Settings',match:'Match',order:'Order',stock:'Stock',verify:'Verify',diff:'Diff',connection:'Connection',setup:'Setup',pause:'Pause'};
if(routes[a])page=routes[a];
else if(a==='confirm-match'){matched=true;page='Order';notice='Sample result: product linked; order rechecked and imported as S0048.';}
else if(a==='publish-stock'){stock=true;notice='Sample result: approved quantities sent and confirmed by Shopify readback.';}
else if(a==='verify-remote'){verified=true;notice='Sample result: exact existing shipment found and linked. No duplicate created.';}
else if(a==='export'){exported=true;notice='Sample result: title and price confirmed by readback.';}
else if(a==='setup-next')stage=Math.min(5,stage+1);
else if(a==='setup-back')stage=Math.max(0,stage-1);
else if(a==='exit-setup'){page='Settings';notice='Setup draft retained in this walkthrough. Review setup to resume.';}
else if(a==='activate'){page='Activated';}
else if(a==='confirm-pause'){paused=true;page='Settings';notice='Sample result: new work paused.';}
else if(a==='resume'){paused=false;page='Settings';notice='Sample result: readiness rechecked; eligible work resumed.';}
else if(button.id==='ad-reset'){page='Overview';stage=0;matched=stock=verified=exported=paused=false;root.querySelector('#ad-store').value='active';}
if(a==='overview')root.querySelector('#ad-store').value='active';
draw();
});
root.addEventListener('change',e=>{if(e.target.id==='ad-store'){page=e.target.value==='setup'?'Setup':'Overview';draw();}if(e.target.name==='candidate')root.querySelector('#ad-confirm-match').disabled=e.target.value!=='current'||paused;});
draw();
})();
</script>
