function stockRow(r){const hist=state.stock.at<'2026-09-22';return `<tr><td class="product-cell"><button class="row-link" data-stock-source="${r.id}">${esc(r.name)}</button><small>${r.ref}</small><small class="mobile-location">${r.warehouse} · ${r.location}</small></td><td class="location-cell">${r.warehouse}<small>${r.location}</small></td><td class="secondary muted">${r.category}</td><td class="numeric onhand ${r.qty<0?'negative':''}">${money(r.qty)}<span class="stock-unit">PCS</span></td><td class="numeric secondary">${hist?'—':money(Math.min(r.reserved,Math.max(0,r.qty)))}</td><td class="numeric secondary">${hist?'—':money(r.qty-Math.min(r.reserved,Math.max(0,r.qty)))}</td><td class="numeric secondary">${hist?'—':money(24)}</td><td class="numeric secondary">${hist?'—':money(r.reserved)}</td><td class="numeric secondary">${hist?'—':money(r.qty+24-r.reserved)}</td><td class="actions-cell"><button class="icon-btn detail-toggle" data-stock-detail="${r.id}" aria-label="Show details for ${esc(r.name)}" aria-expanded="${state.openRow===r.id}">${icon('down')}</button><button class="icon-btn hide-small secondary" data-stock-source="${r.id}" aria-label="View stock for ${esc(r.name)}">${icon('arrow','directional')}</button></td></tr>${state.openRow===r.id?`<tr class="stock-detail"><td colspan="10"><div class="stock-detail-grid"><div><span>Category</span><b>${r.category}</b></div><div><span>Warehouse</span><b>${r.warehouse}</b></div>${hist?'':`<div><span>Incoming</span><b>24 PCS</b></div><div><span>Outgoing</span><b>${n(r.reserved)} PCS</b></div><div><span>Forecasted</span><b>${n(r.qty+24-r.reserved)} PCS</b></div>`}<div><span>Reserved</span><b>${hist?'Not shown at a past date':n(Math.min(r.reserved,Math.max(0,r.qty)))+' PCS'}</b></div><div><span>Available</span><b>${hist?'Not shown at a past date':n(r.qty-Math.min(r.reserved,Math.max(0,r.qty)))+' PCS'}</b></div></div><button class="text-btn" style="margin-top:12px" data-stock-source="${r.id}">${t('View stock')} ${icon('arr if(key.startsWith('document:')){const [,type,ref]=key.split(':');d=[ref,({orders:'Sales Order',quotations:'Quotation',invoices:'Customer Invoice',purchases:'Purchase Order',bills:'Vendor Bill'})[type],`Open ${ref}, retaining dashboard and document-search selections.`,()=>null]}if(key.startsWith('partner-ledger:')){d=['Partner Ledger','Partner Ledger','The same company and balance cutoff, using the selected receivable or payable account scope.',()=>null]}if(key.includes('-bucket:')){let side=key.slice(0,2),i=+key.split(':')[1],values=side==='ar'?[218000,31000,12000,7400,9000,9000]:[157400,18000,9000,6200,4000,4000];d=[['Not overdue','1–30 days overdue','31–60 days overdue','61–90 days overdue','91–120 days overdue','Over 120 days overdue'][i],side==='ar'?'Aged Receivable':'Aged Payable','This exact signed bucket at '+date(state.cutoff)+'.',()=>values[i]]}if(key.startsWith('cash:')){const account=key.slice(5);d=[account,'General Ledger','Signed posted balance for this active account at '+date(state.cutoff)+'.',()=>({'Main bank account':607200,'Bank overdraft':-7200,'Retail cash':28000,'Office petty cash':12000}[account]??null)]}if(key.startsWith('salesperson-margin:')){d=[name,'Invoice Analysis · commercial margin','Commercial margin using the existing current-cost business definition, by invoice salesperson. This is separate from Profit & Loss gross profit.',()=>amt(Math.round((PEOPLE.find(r=>r[0]===name)?.[1]||0)*.362))]}const val=d[3]();const chartIndex=key.match(/trend-(\d)/)?.[1];const sourceDate=key==='valuation'?date(state.stock.at):chartIndex!==undefined?(['April','May','June','July','August','September'][+chartIndex]+' 2026'+(+chartIndex===5?' · 1–22':' · full month')):null;openModal(report?t('Sample source report'):t(d[0]),`${report?'<span class="pill brand">Report destination preview</span>':''}<div class="drawer-value">${val==null?'':quantity?money(val)+' <span class="currency">'+state.productUnit+'</span>':currency(val)}</div><dl class="definition-list"><div><dt>Report</dt><dd>${esc(d[1])}</dd></div><div><dt>What this means</dt><dd>${esc(d[2])}</dd></div><div><dt>Company</dt><dd>${companyName()} · EGP</dd></div><div><dt>${key==='valuation'?'Stock date':chartIndex!==undefined?'Selected chart period':['approvals','late'].includes(key)?'Date basis':['cash','ar','ap','ar-overdue','ap-overdue','balance'].includes(key)||key.startsWith('supplier')||key.startsWith('cash:')||key.startsWith('partner-ledger:')||key.includes('-bucket:')?'Balance cutoff':'Period'}</dt><dd>${sourceDate||(['approvals','late'].includes(key)?'Current worklist · today, not the selected period':['cash','ar','ap','ar-overdue','ap-overdue','balance'].includes(key)||key.startsWith('supplier')||key.startsWith('cash:')||key.startsWith('partner-ledger:')||key.includes('-bucket:')?date(state.cutoff):periodText())}</dd></div><div><dt>Measure / filters</dt><dd>${quantity?'Quantity · '+state.productUnit+' · '+esc(name):key.includes('overdue')?'Overdue items only · due today excluded':key.startsWith('salesperson-margin')?'Commercial margin · current cost · '+esc(name||''):key.startsWith('salesperson-order')?'Untaxed confirmed sales orders · '+esc(name||''):name?esc(name):'Existing approved Odoo report definition'}</dd></div></dl>${extra}<div class="callout">This is a standalone design preview. In Odoo, this action opens the corresponding standard report with these filters. No live records are opened or changed here.</div>`,`${state.searchActive&&key.startsWith('document:')?button('Back to search','search','btn'):button('Back to dashboard','close','btn')}${report?'':`<button class="btn primary" data-report="${esc(key)}">View report ${icon('arrow','directional')}</button>`}`)}
function stockSource(id,report=false){const r=stockRows().find(r=>r.id===id);if(!r)return;openModal(report?'Stock quantity · source preview':r.name,`<div class="drawer-value">${money(r.qty)} <span class="currency">PCS on hand</span></div><dl class="definition-list">${[['Product',r.ref+' · '+r.name],['Warehouse',r.warehouse],['Location',r.location],['Stock date',date(state.stock.at)],['Quantity scope','This exact product and location'],['Value scope','Valuation is available separately by company or supported warehouse scope.']].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="callout">Implementation destination: the standard quantity or movement view, filtered to this product, location and date. A company-wide value must not appear as the value of this row.</div>`,`${button('Back to dashboard','close','btn')}<button class="btn" data-valuation-row="${r.id}">Warehouse valuation</button>${report?'':`<button class="btn primary" data-location-report="${r.id}">View stock ${icon('arrow','directional')}</button>`}`)}
function stockValuation(id){const r=stockRows().find(x=>x.id===id);if(!r)return;openModal('Warehouse valuation · source preview',`<span class="pill brand">${esc(r.warehouse)}</span><h3>${esc(r.name)}</h3><dl class="definition-list"><div><dt>Product</dt><dd>${r.ref}</dd></div><div><dt>Warehouse</dt><dd>${r.warehouse}</dd></div><div><dt>Valuation date</dt><dd>${date(state.stock.at)}</dd></div><div><dt>Scope</dt><dd>All valued locations in this warehouse for this product. This is not a strict single-location valuation.</dd></div></dl><div class="callout">The real dashboard must obtain the amount from the installed Inventory Valuation service with this product, warehouse and date. This prototype does not invent a valuation amount.</div>`)}

function searchDialog(){state.searchActive=true;let rows=periodDocs(SEARCHDOCS).filter(r=>(state.searchType==='all'||r.type===state.searchType)&&(docRef(r,r.type)+' '+r.customer+' '+r.salesperson).toLowerCase().includes(state.searchQuery.toLowerCase()));state.searchPage=Math.min(state.searchPage,Math.max(1,Math.ceil(rows.length/6)));openModal(t('Search documents'),`<form id="searchForm"><label>Search<input class="field" id="globalSearch" type="search" placeholder="Document, customer or salesperson" value="${esc(state.searchQuery)}" minlength="2"></label><label>Document type<select id="searchType">${['all','orders','quotations','invoices','purchases','bills'].map(x=>`<option value="${x}" ${state.searchType===x?'selected':''}>${x==='all'?'All documents':x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label><button class="btn primary" type="submit">Search</button><p class="validation" id="searchError"></p></form><div class="search-results">${rows.length?documentsTable(rows,state.searchPage,state.searchType==='all'?'orders':state.searchType)+pager('search',rows.length,state.searchPage,6):'<div class="empty"><h3>No matching documents</h3><p>Try a name or document reference.</p></div>'}</div>`,button('Back to dashboard','close','btn'));}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function about(){openModal('About this design proposal',`<p>A refined version of the existing executive workspace, with simpler controls and clearer paths from a figure to its report.</p><h3>Try the key journeys</h3><ol><li>Switch between all six departments, including HR.</li><li>Open employee profiles; filter attendance and time off; switch between weekly shifts and their full list.</li><li>Switch Company to preview its name/logo; Horizon demonstrates a missing-logo fallback. These sample company profiles represent standard Company settings. Financial fixture data is shared for design illustration; HR fixtures are company-specific.</li><li>Change period, open a figure, then return.</li><li>Apply warehouse and category filters, hide zero or negative stock, and navigate numbered pages.</li><li>Switch product rankings between value and quantity.</li><li>Use dark appearance, Arabic direction or a narrower preview.</li><li>Preview loading, empty, failure and restricted states.</li></ol><h3>What the preview represents</h3><p>All amounts, records and names are fictional. Local data demonstrates interaction, not accounting formulas. Source dialogs specify intended Odoo report behavior. The actual implementation must retain the report-first definitions and access checks.</p><div class="callout">Visual proposal only, pending your review. The audit verdict remains NOT YET READY FOR OWNER UAT. This file makes no network requests and does not modify Odoo.</div>`,'',true)}
function reset(){state={...state,hrTab:'overview',hrFrom:'2026-09-21',hrTo:'2026-09-27',hrDept:'all',hrQuery:'',hrStatus:'all',hrPage:1,hrLayout:'week',hrArchived:false,tab:'finance',period:'mtd',appliedPeriod:'mtd',from:'2026-09-01',to:'2026-09-22',cutoff:'2026-09-22',stock:{...DEFAULT_STOCK},stockDraft:{...DEFAULT_STOCK},stockPage:1,docPage:1,rankLimit:5,docType:'orders',productMeasure:'value',invoiceMeasure:'sales',scenario:'normal',menu:false};closeModal();render();toast('Default view restored. Your saved view is still available.')}
function exportCSV(){const rows=[['Section','Metric','Value','Unit','Period','Cutoff','Data'],...Object.entries(defs).filter(([k,v])=>v[3]()!==null).map(([k,v])=>['Finance / operations',v[0],v[3](),'EGP',periodText(),state.cutoff,'Fictional design sample'])];const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Executive_Dashboard_Design_Sample.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);state.menu=false;render();toast('Sample summary exported.')}

function hrRecords(kind){const ids=new Set(hrBase(kind!=='shifts').map(e=>e.id));if(kind==='employees')return hrBase().filter(e=>state.hrStatus==='all'||(state.hrStatus==='Active'?e.active:!e.active));if(kind==='attendance')return HR_ATTENDANCE.filter(r=>ids.has(r.employee)&&r.date>=state.hrFrom&&r.date<=state.hrTo&&(state.hrStatus==='all'||(state.hrStatus==='Checked in'?!r.checkOut:!!r.checkOut)));if(kind==='leave')return HR_LEAVE.filter(r=>ids.has(r.employee)&&r.from<=state.hrTo&&r.to>=state.hrFrom&&(state.hrStatus==='all'||r.status===state.hrStatus));return HR_SHIFTS.filter(r=>r.company===state.companyKey&&(r.employee?ids.has(r.employee):(state.hrDept==='all'||r.department===state.hrDept))&&(!state.hrQuery||((r.employee?hrEmployee(r.employee).name+' '+hrEmployee(r.employee).job:'')+' '+r.role).toLowerCase().includes(state.hrQuery.toLowerCase()))&&r.start.slice(0,10)<=state.hrTo&&r.end.slice(0,10)>=state.hrFrom&&(state.hrStatus==='all'||state.hrStatus==='Unassigned'&&!r.employee||state.hrStatus==='Published unassigned'&&!r.employee&&r.status==='Published'||r.status===state.hrStatus))}
function hrPill(label){return `<span class="pill ${['Approved','Checked in','Published','Active'].includes(label)?'green':['To approve','Unassigned','Open'].includes(label)?'amber':''}">${t(label)}</span>`}
function hrPerson(e){return `<button class="employee-link" data-employee="${e.id}"><span class="rank-avatar">${e.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><span><b>${esc(e.name)}</b><small>${t(e.department)} · ${esc(e.job)}</small></span></button>`}
function hrMetric(label,value,note,view,status='all'){return `<article class="kpi"><div class="kpi-head">${t(label)}${icon('hr')}</div><button class="kpi-value" data-hr-tab="${view}" data-hr-status="${status}" aria-label="${label}: ${value}">${money(value)}</button><p class="kpi-note">${t(note)}</p><div class="kpi-footer"><span>${view==='employees'?t('Current employees'):view==='attendance'?HR_NOW:view==='shifts'?date(state.hrFrom)+' – '+date(state.hrTo):date(HR_TODAY)}</span><button class="text-btn" data-hr-tab="${view}" data-hr-status="${status}">${t('View details')} ${icon('arrow','directional')}</button></div></article>`}
function hrScope(){return `<form id="hrPeriodForm" class="filterbar" novalidate><div class="group"><label for="company">${t('Company')}</label><select id="company" aria-label="Company">${companyOptions()}</select></div><span class="divider"></span><div class="group"><label for="hrFrom">${t('From')}</label><input id="hrFrom" type="date" value="${state.hrFrom}" required></div><div class="group"><label for="hrTo">${t('To')}</label><input id="hrTo" type="date" value="${state.hrTo}" required></div><button class="btn" type="submit">${t('Apply period')}</button><span class="small muted">Africa/Cairo</span><p id="hrPeriodError" class="validation" role="alert"></p></form>`}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalRoot').firstChild)closeModal();else if(state.menu){state.menu=false;render()}}if(e.key==='Tab'&&$('#modalRoot').firstChild){const list=[...$('#modalRoot').querySelectorAll('button:not(:disabled),input,select,a[href],summary')].filter(x=>!x.hidden);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});
// Optional agent access to the same review-only navigation. No Odoo connection.
if(document.modelContext?.registerTool){const life=new AbortController();try{Promise.resolve(document.modelContext.registerTool({name:'navigate_review_department',title:'Show a dashboard department',description:'Navigate this fictional design preview to an existing department. Does not access or modify Odoo.',inputSchema:{type:'object',properties:{department:{type:'string',enum:['finance','sales','inventory','procurement','crm','hr']}},required:['department'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!['finance','sales','inventory','procurement','crm','hr'].includes(input.department)||Object.keys(input).some(k=>k!=='department'))throw new Error('Choose an existing department.');state.tab=input.department;state.scenario='normal';state.menu=false;render();return {department:state.tab,period:periodText(),cutoff:state.cutoff,sampleData:true}}},{signal:life.signal})).catch(()=>{});addEventListener('pagehide',()=>life.abort(),{once:true})}catch(e){}}
