<title>Executive 360 Concept</title>
<meta name="description" content="Reference design for the Odoo executive dashboard: overview-first, side panel detail, every figure opens its records. Example data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f4f7; --panel:#ffffff; --soft:#f9f8fa; --ink:#1d1b22; --muted:#625d6b; --faint:#8b8594;
  --line:#e6e3ea; --line-strong:#d3cfd9;
  --brand:#714b67; --brand-ink:#ffffff; --brand-tint:#f3ecf1; --brand-hover:#5c3b53;
  --good:#1d7a4f; --good-soft:#e8f4ee; --warn:#9a5b00; --warn-soft:#fdf1dc; --crit:#b3303a; --crit-soft:#fbe9eb;
  --s1:#2a78d6; --s2:#eb6834;
  --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#1c5cab; --a5:#104281;
  --shadow:0 18px 50px rgba(29,27,34,.16);
  --scrim:rgba(29,27,34,.28);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
    --line:#302d37; --line-strong:#423e4a;
    --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-tint:#34283a; --brand-hover:#e4c5dd;
    --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630;
    --s1:#3987e5; --s2:#d95926;
    --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
    --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
  --line:#302d37; --line-strong:#423e4a;
  --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-tint:#34283a; --brand-hover:#e4c5dd;
  --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630;
  --s1:#3987e5; --s2:#d95926;
  --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
  --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.02em}
.brand strong{display:block;font-size:14px}
.brand small{color:var(--muted);font-size:12px}
.rail-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;margin:0}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-tint);color:var(--brand)}
.nav-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn .count{margin-inline-start:auto;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
.nav-btn kbd{margin-inline-start:auto;font:11px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--faint);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.topbar h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em;margin-inline-end:auto}
.topbar h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:13px var(--font);color:var(--ink)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--good);background:var(--good-soft);border-radius:999px;padding:4px 10px;border:0;cursor:pointer}
.status-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.menu-toggle{display:none}

.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:20px}
.example-note{font-size:12px;color:var(--faint);margin:0}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(29,27,34,.06)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi-value{font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:3px}
.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.delta.up-good,.delta.down-good{color:var(--good)} .delta.up-bad,.delta.down-bad{color:var(--crit)} .delta.flat{color:var(--muted)}
.delta span{font-weight:400;color:var(--faint)}
.spark{height:30px;width:100%;display:block;margin-top:2px}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}.span-5{grid-column:span 5}.span-7{grid-column:span 7}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.panel-head h2{font-size:15px;margin:0;font-weight:600}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link.plain{color:var(--muted);font-weight:500}
.big{font-size:28px;font-weight:600;letter-spacing:-.015em}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}

/* chart */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--faint);font-size:11px}
.grid-line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}

/* attention */
.att-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;border:0;background:none;padding:10px 8px;border-radius:10px;cursor:pointer;text-align:start}
.att:hover{background:var(--soft)}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.sev svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sev.crit{background:var(--crit-soft);color:var(--crit)} .sev.warn{background:var(--warn-soft);color:var(--warn)} .sev.info{background:var(--brand-tint);color:var(--brand)} .sev.good{background:var(--good-soft);color:var(--good)}
.att-title{font-weight:500;display:block;margin-top:4px}
.att .sev{justify-self:start}
.att-sub{font-size:12px;color:var(--muted)}
.att-amt{font-weight:600;white-space:nowrap}

/* lists / tables */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:12px}
.row .r{font-weight:600;white-space:nowrap}
.row.click{cursor:pointer;border-radius:8px;padding-inline:6px;margin-inline:-6px}
.row.click:hover{background:var(--soft)}
.group-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:10px 0 2px;display:flex;justify-content:space-between}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:end}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
td .ref{color:var(--brand);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:0;cursor:pointer;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.info{background:var(--brand-tint);color:var(--brand)}

/* status tiles (deliveries) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--line-strong)}
.tile b{font-size:22px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tile.crit b{color:var(--crit)} .tile.warn b{color:var(--warn)}

/* aging bar */
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px}
.stack button:hover{filter:brightness(1.08)}
.aging-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.aging-legend button{border:0;background:none;text-align:start;padding:4px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.aging-legend button:hover{background:var(--soft)}
.aging-legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.aging-legend span i{width:8px;height:8px;border-radius:2px;display:inline-block}
.aging-legend b{font-size:13px;font-weight:600}

/* hbar */
.hbar{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) 44px;gap:8px 10px;align-items:center;font-size:13px}
.hbar .track{height:10px}
.hbar .track i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
[dir="rtl"] .hbar .track i{border-radius:4px 0 0 4px}
.hbar .v{text-align:end;font-weight:600}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe button{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pipe button:hover{border-color:var(--line-strong)}
.pipe small{color:var(--muted);font-size:12px}
.pipe b{font-size:18px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(480px,100%);background:var(--panel);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer{visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.drawer.on{transform:none!important;visibility:visible;transition:transform .22s ease}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-head div{flex:1;min-width:0}
.drawer-head .crumb{font-size:12px;color:var(--faint);margin:0 0 2px}
.drawer-head h2{margin:0;font-size:18px;font-weight:600}
.drawer-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.drawer-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.dest{font-size:12px;color:var(--muted);flex-basis:100%}
.search-input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font:15px var(--font);background:var(--soft);color:var(--ink)}
.recon{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--good);background:var(--good-soft);border-radius:8px;padding:8px 10px}
.note{font-size:12px;color:var(--muted);margin:0}
.def dt{font-weight:600;margin-top:10px}
.def dd{margin:2px 0 0;color:var(--muted);font-size:13px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s}
[dir="rtl"] .toast{transform:translateX(50%)}
.toast.on{opacity:1}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-8,.span-4,.span-6,.span-5,.span-7{grid-column:span 12}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  [dir="rtl"] .rail{transform:translateX(105%)}
  .rail.on{transform:none!important}
  .menu-toggle{display:inline-grid}
  .topbar{padding:10px 16px}
  .content{padding:16px 16px 40px}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles,.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .aging-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Dashboard navigation">
    <div class="brand"><div class="brand-mark">EX</div><div><strong>Example Trading Co.</strong><small>Executive workspace</small></div></div>
    <p class="rail-label">Workspace</p>
    <nav id="nav" aria-label="Departments"></nav>
    <p class="rail-label">Quick access</p>
    <button class="nav-btn" data-open="attention"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></svg>Needs attention<span class="count" id="attCount">7</span></button>
    <button class="nav-btn" data-open="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<kbd>/</kbd></button>
    <button class="nav-btn" data-open="definitions"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M8 7h7M8 11h5"/></svg>Definitions</button>
    <div class="rail-foot">Reference design · example data only.<br>Figures are invented for layout review.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Open navigation" aria-controls="rail" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Overview<small id="pageSub">Company-wide view · as of 25 Sep 2026</small></h1>
      <div class="seg" role="group" aria-label="Period" id="periodSeg">
        <button aria-pressed="true" data-p="month">This month</button><button aria-pressed="false" data-p="quarter">Quarter</button><button aria-pressed="false" data-p="ytd">Year to date</button>
      </div>
      <select class="select" id="compare" aria-label="Compare with"><option value="prior">vs prior period</option><option value="ly">vs same period last year</option></select>
      <button class="status-pill" data-open="definitions" title="Reporting status">Posted entries · no report warnings</button>
      <button class="icon-btn" id="dirBtn" aria-label="Switch layout direction" title="Preview right-to-left layout"><svg viewBox="0 0 24 24"><path d="M7 7h13M7 7l3-3M7 7l3 3M17 17H4m13 0-3-3m3 3-3 3"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme (in Odoo: follows the user's dark mode setting)"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="drawer-head"><div><p class="crumb" id="dCrumb"></p><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <button class="icon-btn" id="dClose" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kpiValue(k){
  const f = (k.flow ? P[state.period].f : 1);
  const v = k.value * f;
  if (k.pct) return `${nf2.format(v).replace(/0$/,'')}<small>%</small>`;
  if (k.count) return nf0.format(v);
  return `${v>=1e6 ? M(v) : nf0.format(v)}<small>${k.unit}</small>`;
}
function deltaHtml(k){
  const d = k.d[state.compare];
  const cmp = state.compare==='prior' ? P[state.period].prior : P[state.period].ly;
  if (!d) return `<span class="delta flat">No change <span>vs ${cmp}</span></span>`;
  const up = d>0, cls = k.goodUp===null ? 'flat' : ((up===k.goodUp) ? (up?'up-good':'down-good') : (up?'up-bad':'down-bad'));
  const txt = k.pts ? `${up?'+':'−'}${Math.abs(d).toFixed(1)} pts` : `${up?'+':'−'}${Math.abs(d).toFixed(1)}%`;
  return `<span class="delta ${cls}">${up?'▲':'▼'} ${txt} <span>vs ${cmp}</span></span>`;
}
function spark(vals){
  const w=160,h=30,min=Math.min(...vals),max=Math.max(...vals),r=max-min||1;
  const pts = vals.map((v,i)=>[i*(w-4)/(vals.length-1)+2, h-3-(v-min)/r*(h-8)]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]} ${h} L2 ${h}Z" fill="var(--brand)" opacity=".08"/><path d="${d}" fill="none" stroke="var(--faint)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--brand)"/></svg>`;
}
function kpis(keys){

    <button class="kpi" data-open="${k.open}" aria-label="${esc(k.label)}: open details">
      <span class="kpi-label">${esc(k.label)}</span>
      <span class="kpi-value num">${kpiValue(k)}</span>${deltaHtml(k)}${spark(k.spark)}</button>`;}).join('')}</section>`;
}

/* ---------- trend chart ---------- */
function trendChart(host, series, opts={}){
  const W = Math.max(280, host.clientWidth), H = opts.h||240, pad={l:44,r:12,t:10,b:26};
  const max = Math.ceil(Math.max(...series.flatMap(s=>s.v))/5e6)*5e6;
  const x = i => pad.l + i*(W-pad.l-pad.r)/(months.length-1);
  const y = v => pad.t + (1-v/max)*(H-pad.t-pad.b);
  let g = '';
  for (let t=0;t<=max;t+=5e6) g += `<line class="grid-line" x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${pad.l-8}" y="${y(t)+4}" text-anchor="end">${t/1e6}M</text>`;
  const xl = months.map((m,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${m}</text>`).join('');
  const lines = series.map(s=>{
    const full = s.v.slice(0,-1).map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('');
    const n=s.v.length-1, part=`M${x(n-1)} ${y(s.v[n-1])}L${x(n)} ${y(s.v[n])}`;
    const area = s.area ? `<path d="${full}L${x(n)} ${y(s.v[n])}L${x(n)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(${s.c})" opacity=".08"/>` : '';
    return `${area}<path d="${full}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round"/><path d="${part}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-dasharray="4 4"/>`
      + `<circle cx="${x(n)}" cy="${y(s.v[n])}" r="4" fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>`;
  }).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label||'Monthly trend')}"><g class="axis">${g}${xl}</g>${lines}<line id="xh" y1="${pad.t}" y2="${H-pad.b}" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/><g id="dots"></g><rect x="${pad.l}" y="0" width="${W-pad.l-pad.r}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = svg.querySelector('#xh'), dots = svg.querySelector('#dots');
  const show = i => {
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.setAttribute('visibility','visible');
    dots.innerHTML = series.map(s=>`<circle cx="${x(i)}" cy="${y(s.v[i])}" r="4" fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<b>${months[i]} ${i<3?'2025':'2026'}${i===11?' · to 25 Sep':''}</b>` + series.map(s=>`<div><span><i style="background:var(${s.c})"></i>${s.name}</span><span class="num">EGP ${M(s.v[i])}</span></div>`).join('');
    tip.hidden = false;
    const tx = Math.min(Math.max(x(i)+12, 0), W-170); tip.style.left = (x(i) > W-190 ? x(i)-172 : tx)+'px'; tip.style.top = '8px';
  };
  const hide = () => { xh.setAttribute('visibility','hidden'); dots.innerHTML=''; tip.hidden = true; };
  const hit = svg.querySelector('#hit');
  hit.addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX-r.left)*W/r.width; show(Math.max(0,Math.min(11,Math.round((px-pad.l)/((W-pad.l-pad.r)/11))))); });
  hit.addEventListener('pointerleave', hide);
  hit.addEventListener('click', e => { openDrawer('revenue'); });
}
function trendPanel(cls){
  return panel(cls,'Revenue & net profit','Posted, last 12 months · EGP · September is month to date (dashed)',
    `<div class="legend"><span><i style="background:var(--s1)"></i>Revenue</span><span><i style="background:var(--s2)"></i>Net profit</span></div><div class="chart-wrap" data-chart="trend"></div>`,
    `<div style="display:flex;gap:12px"><button class="link plain" data-open="trend-table">Table</button>${openLink('revenue','Profit and loss')}</div>`);
}

/* ---------- drawer mechanics ---------- */
const drawer=$('#drawer'), scrim=$('#scrim'); let lastFocus=null;
function openDrawer(key, el){
  const f = D[key]; if(!f) return;
  const d = f(el);
  $('#dCrumb').textContent=d.crumb; $('#dTitle').textContent=d.title; $('#dSub').textContent=d.sub||'';
  $('#dBody').innerHTML=d.body; $('#dFoot').innerHTML=d.foot||''; $('#dFoot').hidden=!d.foot;
  if(!drawer.classList.contains('on')) lastFocus=document.activeElement;
  drawer.classList.add('on'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  const ch = $('[data-chart="trend-drawer"]', drawer); if(ch) trendChart(ch,[{name:'Revenue',v:revenue,c:'--s1',area:true},{name:'Net profit',v:profit,c:'--s2'}],{h:200});
  if(key==='search'){ const q=$('#q'); q.focus(); q.addEventListener('input',()=>searchRender(q.value)); searchRender(''); }
  else $('#dClose').focus();
  $('#dBody').scrollTop=0;
}
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); drawer.setAttribute('aria-hidden','true'); lastFocus?.focus?.(); }
function searchRender(q){
  const all = [...recentOrders.map(r=>['Sales orders',r[0],r[1],'so-deliveries']),...lateDeliveries.map(r=>['Deliveries',r[0],r[1],'picking']),...poApprove.map(r=>['Purchase orders',r[0],r[1],'po-one']),...customers.map(c=>['Partners',c,'Customer','partner'])];
  const s=q.trim().toLowerCase(); const hits = s? all.filter(a=>(a[1]+' '+a[2]).toLowerCase().includes(s)) : all.slice(0,6);
  const groups = {}; hits.slice(0,20).forEach(h=>(groups[h[0]]=groups[h[0]]||[]).push(h));
  $('#qres').innerHTML = hits.length ? Object.entries(groups).map(([g,rows])=>`<div class="group-label"><span>${g}</span><span>${rows.length}</span></div><div class="rows">${rows.map(r=>`<div class="row click" data-open="${r[3]}" data-ref="${esc(r[1])}"><span class="l">${esc(r[1])}<small>${esc(r[2])}</small></span></div>`).join('')}</div>`).join('') : `<p class="note">No matches for “${esc(q)}”. Search looks at references, customer and supplier names.</p>`;
}
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3200); }

/* ---------- page render ---------- */
const navItems = [['overview','Overview','<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'],
  ['finance','Finance','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],['sales','Sales','<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'],
  ['operations','Operations','<path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/>'],['procurement','Procurement','<path d="M6 6h15l-2 9H7L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>'],
  ['people','People','<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>']];
function render(){
  $('#nav').innerHTML = navItems.map(n=>`<button class="nav-btn" data-page="${n[0]}" ${state.page===n[0]?'aria-current="page"':''}><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}</button>`).join('');
  const p = pages[state.page];
  $('#pageTitle').innerHTML = `${p.title}<small>${p.sub} · ${P[state.period].label}</small>`;
  $('#content').innerHTML = p.render() + `<p class="example-note">Reference design with invented example figures. Every figure and row opens a side panel; “Open in Odoo” names the native screen it would open.</p>`;
  document.querySelectorAll('[data-chart="trend"]').forEach(h=>trendChart(h,[{name:'Revenue',v:revenue,c:'--s1',area:true},{name:'Net profit',v:profit,c:'--s2'}],{label:'Revenue and net profit by month',h:h.closest('.span-8')?300:240}));
  try{ localStorage.setItem('ex360', JSON.stringify(state)); }catch(e){}
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]'); if(go){ toast('In Odoo this opens: '+go.dataset.go); return; }
  const pg = e.target.closest('[data-page]'); if(pg){ state.page=pg.dataset.page; closeRail(); render(); window.scrollTo({top:0}); return; }
  const op = e.target.closest('[data-open]'); if(op){ closeRail(); openDrawer(op.dataset.open, op); return; }
});
$('#dClose').onclick=closeDrawer; scrim.onclick=closeDrawer;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && drawer.classList.contains('on')) closeDrawer();
  if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openDrawer('search'); }
  if(e.key==='Tab' && drawer.classList.contains('on')){
    const f=[...drawer.querySelectorAll('button,input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.closest('[hidden]'));
    if(!f.length) return; const first=f[0], last=f[f.length-1];
    if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
$('#periodSeg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; state.period=b.dataset.p; $('#periodSeg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render(); });
$('#compare').onchange = e=>{ state.compare=e.target.value; render(); };
$('#themeBtn').onclick = ()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; render(); };
$('#dirBtn').onclick = ()=>{ const r=document.documentElement; const rtl = r.getAttribute('dir')==='rtl'; r.setAttribute('dir', rtl?'ltr':'rtl'); r.style.setProperty('--flip', rtl?1:-1); render(); toast(rtl?'Left-to-right layout':'Right-to-left layout preview (labels stay in English here)'); };
const rail=$('#rail'), menuBtn=$('#menuBtn');
function closeRail(){ rail.classList.remove('on'); menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.onclick = ()=>{ const on=!rail.classList.contains('on'); rail.classList.toggle('on',on); menuBtn.setAttribute('aria-expanded',on); };
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ document.querySelectorAll('[data-chart]').forEach(h=>trendChart(h,[{name:'Revenue',v:revenue,c:'--s1',area:true},{name:'Net profit',v:profit,c:'--s2'}],{h:h.dataset.chart==='trend-drawer'?200:(h.closest('.span-8')?300:240)})); },120); });

try{ const s=JSON.parse(localStorage.getItem('ex360')||'null'); if(s && pages[s.page]){ Object.assign(state,s); $('#compare').value=state.compare; $('#periodSeg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.p===state.period)); } }catch(e){}
render();
})();
</script>
