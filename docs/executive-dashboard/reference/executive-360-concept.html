<title>Executive Dashboard Concept</title>
<meta name="description" content="Reference design for the Executive Dashboard for Odoo: welcome screen, six sections, side-panel detail, responsive layouts. Example data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f4f7; --panel:#ffffff; --soft:#f8f7fa; --ink:#1d1b22; --muted:#5f5a68; --faint:#89838f;
  --line:#e6e3ea; --line-strong:#d3cfd9;
  --brand:#714b67; --brand-ink:#ffffff; --brand-hover:#5c3b53;
  --good:#1d7a4f; --good-soft:#e6f4ec; --warn:#9a5b00; --warn-soft:#fdf0d9; --crit:#b3303a; --crit-soft:#fbe8ea; --info:#2563c9; --info-soft:#e8f0fc;
  --c-fin:#0b7a6d; --c-sal:#2563c9; --c-crm:#6d45c4; --c-pro:#a35705; --c-inv:#3b7a1a; --c-ppl:#b53461; --c-wel:#714b67;
  --s1:#2a78d6; --s2:#eb6834;
  --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#1c5cab; --a5:#104281;
  --shadow:0 18px 50px rgba(29,27,34,.16); --scrim:rgba(29,27,34,.3);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --sec:var(--c-wel);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
    --line:#302d37; --line-strong:#423e4a;
    --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-hover:#e4c5dd;
    --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630; --info:#8fb8f4; --info-soft:#1f2c42;
    --c-fin:#5fd0bf; --c-sal:#7fb0f2; --c-crm:#b9a2f3; --c-pro:#f2ab5c; --c-inv:#95d77c; --c-ppl:#f28bb0; --c-wel:#d5a9cb;
    --s1:#3987e5; --s2:#d95926;
    --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
    --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
  --line:#302d37; --line-strong:#423e4a;
  --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-hover:#e4c5dd;
  --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630; --info:#8fb8f4; --info-soft:#1f2c42;
  --c-fin:#5fd0bf; --c-sal:#7fb0f2; --c-crm:#b9a2f3; --c-pro:#f2ab5c; --c-inv:#95d77c; --c-ppl:#f28bb0; --c-wel:#d5a9cb;
  --s1:#3987e5; --s2:#d95926;
  --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
  --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
}
[data-sec="welcome"]{--sec:var(--c-wel)} [data-sec="finance"]{--sec:var(--c-fin)} [data-sec="sales"]{--sec:var(--c-sal)} [data-sec="crm"]{--sec:var(--c-crm)}
[data-sec="procurement"]{--sec:var(--c-pro)} [data-sec="inventory"]{--sec:var(--c-inv)} [data-sec="people"]{--sec:var(--c-ppl)}
[data-sec]{--sec-soft:color-mix(in srgb,var(--sec) 13%,var(--panel));--sec-wash:color-mix(in srgb,var(--sec) 8%,var(--bg))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--sec);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#714b67,#9a5f8a);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand strong{display:block;font-size:14px;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.rail-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;margin:0}
:lang(ar) .rail-label,:lang(ar) .group-label,:lang(ar) th{letter-spacing:0}
.nav-btn{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:9px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav-btn .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--sec);background:var(--sec-soft);flex:none}
.nav-btn .ic svg{width:16px;height:16px}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--sec-soft);color:var(--ink);font-weight:600}
.nav-btn[aria-current="page"] .ic{background:var(--sec);color:var(--panel)}
.nav-btn .count{margin-inline-start:auto;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
.nav-btn kbd{margin-inline-start:auto;font:11px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.quick .ic{color:var(--muted);background:var(--soft)}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;flex-direction:column;gap:8px}
.rail-foot label{display:flex;flex-direction:column;gap:4px}

.main{min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--sec-wash) 0,var(--bg) 340px)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.title{display:flex;align-items:center;gap:12px;margin-inline-end:auto;min-width:0}
.title .ic{width:38px;height:38px;border-radius:10px;background:var(--sec);color:var(--panel);display:grid;place-items:center;flex:none}
.title .ic svg{width:20px;height:20px}
.title h1{font-size:20px;margin:0;font-weight:600;line-height:1.2}
.title small{display:block;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sec);color:var(--panel)}
.custom{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.field{background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink);min-width:0}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;color:var(--muted);flex:none;position:relative}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--panel)}
.tb-compact{display:none}
.mnav{display:none}

.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:18px;width:100%;max-width:1680px;margin-inline:auto}
.example-note{font-size:12px;color:var(--faint);margin:0}

/* ---------- welcome ---------- */
.welcome{max-width:1080px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:26px;padding-block:20px}
.hello{display:flex;flex-direction:column;gap:6px}
.hello .date{color:var(--muted);font-size:14px;margin:0}
.hello h2{font-size:36px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.search-launch{display:flex;align-items:center;gap:10px;width:100%;max-width:600px;border:1px solid var(--line-strong);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:text;color:var(--faint);text-align:start;box-shadow:0 2px 8px rgba(29,27,34,.04)}
.search-launch kbd{margin-inline-start:auto;font:11px var(--font);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card::after{content:"";position:absolute;inset-block-start:-60px;inset-inline-end:-60px;width:160px;height:160px;border-radius:50%;background:var(--sec-soft);opacity:.8;pointer-events:none}
.card:hover{border-color:var(--sec);box-shadow:0 10px 28px rgba(29,27,34,.08);transform:translateY(-2px)}
.card .ic{position:relative;z-index:1;width:44px;height:44px;border-radius:12px;background:var(--sec);color:var(--panel);display:grid;place-items:center}
.card .ic svg{width:22px;height:22px}
.card h3{margin:0;font-size:17px;font-weight:600;position:relative;z-index:1}
.card p{margin:0;color:var(--muted);font-size:13px;position:relative;z-index:1}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.card li{font-size:12px;color:var(--sec);background:var(--sec-soft);border-radius:999px;padding:2px 10px;font-weight:500}

/* ---------- figures ---------- */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;min-width:0;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:color-mix(in srgb,var(--sec) 45%,var(--line));box-shadow:0 6px 18px rgba(29,27,34,.07)}
.kpi .kic{grid-row:span 3;align-self:start;width:38px;height:38px;border-radius:10px;background:var(--sec-soft);color:var(--sec);display:grid;place-items:center}
.kpi .kic svg{width:19px;height:19px}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.kpi-value small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi-cap{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- panels ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:15px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-head h2::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--sec);flex:none}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.fill{flex:1 1 auto;min-height:0}
.link{border:0;background:none;color:var(--sec);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link svg{width:14px;height:14px}
.big{font-size:28px;font-weight:600;line-height:1.2}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px}
.tabs button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--sec);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--soft) 0,var(--line) 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* charts */
.chart-wrap{position:relative;min-height:220px;display:flex}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.axis text,.xlabel{fill:var(--faint);font-size:11px;font-family:var(--font)}
.vlabel{fill:var(--muted);font-size:11px;font-weight:600;font-family:var(--font)}
.grid-line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.col-hit{cursor:pointer}
.col-hit:hover path{filter:brightness(1.12)}

/* rows & tables */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0;display:flex;align-items:center;gap:10px}
.row .l > span{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:12px}
.row .r{font-weight:600;white-space:nowrap;text-align:end}
.row .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row.click{cursor:pointer;border-radius:9px;padding-inline:8px;margin-inline:-8px}
.row.click:hover{background:var(--soft)}
.rank{width:24px;height:24px;border-radius:50%;background:var(--sec-soft);color:var(--sec);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#fff}
.who{display:flex;gap:10px;align-items:center}
.total-row{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line-strong);font-weight:600;margin-top:auto}
.group-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:4px 0 0;display:flex;justify-content:space-between}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:end}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
td small{display:block;color:var(--muted);font-size:12px}
td.neg{color:var(--crit);font-weight:600}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.neutral{background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .grow{flex:1 1 220px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager div{display:flex;gap:6px}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(var(--tn,4),minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{border-color:var(--line-strong)}
.tile b{font-size:24px;font-weight:600;line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile small{font-size:11px;color:var(--faint)}
.tile.crit{background:var(--crit-soft);border-color:transparent} .tile.crit b{color:var(--crit)}
.tile.warn{background:var(--warn-soft);border-color:transparent} .tile.warn b{color:var(--warn)}
.tile.good{background:var(--good-soft);border-color:transparent} .tile.good b{color:var(--good)}
.tile.sec{background:var(--sec-soft);border-color:transparent} .tile.sec b{color:var(--sec)}

/* aging */
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px}
.stack button:hover{filter:brightness(1.1)}
.age-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.age-legend button{border:0;background:none;text-align:start;padding:6px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.age-legend button:hover{background:var(--soft)}
.age-legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.age-legend span i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.age-legend b{font-size:14px;font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(540px,100%);background:var(--panel);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding-top:env(safe-area-inset-top,0px)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none!important;visibility:visible;transition:transform .22s ease}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--sec-wash),var(--panel))}
.drawer-head > div{flex:1;min-width:0}
.crumb{font-size:12px;color:var(--faint);margin:0 0 2px;display:flex;gap:8px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--sec);cursor:pointer;font-size:12px;font-weight:600}
.drawer-head h2{margin:0;font-size:18px;font-weight:600}
.drawer-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.drawer-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}

function lineChart(host, series, minH=240){
  host.innerHTML=''; const W = Math.max(280, host.clientWidth), H = Math.max(minH, Math.min(440, host.clientHeight||0)), pad={l:44,r:14,t:10,b:26};
  const max = Math.ceil(Math.max(...series.flatMap(s=>s.v))/5e6)*5e6;
  const rtl = document.documentElement.dir==='rtl';
  const x0 = i => pad.l + i*(W-pad.l-pad.r)/(months.length-1), X = i => rtl ? W - x0(i) : x0(i), y = v => pad.t + (1-v/max)*(H-pad.t-pad.b);
  const n = months.length-1;
  let g=''; for (let v=0; v<=max; v+=5e6) g+=`<line class="grid-line" x1="${rtl?pad.r:pad.l}" x2="${rtl?W-pad.l:W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${rtl?W-pad.l+8:pad.l-8}" y="${y(v)+4}" text-anchor="${rtl?'start':'end'}">${v/1e6}M</text>`;
  const xl = months.map((m,i)=>(W<420 && i%2)?'':`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${m}</text>`).join('');
  const lines = series.map(s=>{ const p=s.v.slice(0,-1).map((v,i)=>(i?'L':'M')+X(i)+' '+y(v)).join('');
    const area = s.area?`<path d="${p}L${X(n)} ${y(s.v[n])}L${X(n)} ${y(0)}L${X(0)} ${y(0)}Z" fill="${s.c}" opacity=".1"/>`:'';
    return `${area}<path d="${p}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/><path d="M${X(n-1)} ${y(s.v[n-1])}L${X(n)} ${y(s.v[n])}" stroke="${s.c}" stroke-width="2" stroke-dasharray="4 4" fill="none"/><circle cx="${X(n)}" cy="${y(s.v[n])}" r="4" fill="${s.c}" stroke="var(--panel)" stroke-width="2"/>`; }).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Monthly trend"><g class="axis">${g}${xl}</g>${lines}<line class="xh" y1="${pad.t}" y2="${H-pad.b}" stroke="var(--line-strong)" visibility="hidden"/><g class="dots"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg=$('svg',host), tip=$('.tip',host), xh=$('.xh',svg), dots=$('.dots',svg);
  const show=i=>{ xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('visibility','visible');
    dots.innerHTML=series.map(s=>`<circle cx="${X(i)}" cy="${y(s.v[i])}" r="4" fill="${s.c}" stroke="var(--panel)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<b>${months[i]} ${i<3?2025:2026}${i===n?' · 1–25':''}</b>`+series.map(s=>`<div><span><i style="background:${s.c}"></i>${esc(t(s.name))}</span><span class="num">${M(s.v[i])}</span></div>`).join('');
    tip.hidden=false; const px=X(i); tip.style.left=(px>W/2? px-176 : px+14)+'px'; tip.style.top='6px'; };
  $('.hit',svg).addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(); let px=(e.clientX-r.left)*W/r.width; if(rtl) px=W-px; show(Math.max(0,Math.min(n,Math.round((px-pad.l)/((W-pad.l-pad.r)/n))))); });
  $('.hit',svg).addEventListener('pointerleave',()=>{ xh.setAttribute('visibility','hidden'); dots.innerHTML=''; tip.hidden=true; });
}
function columnChart(host, data, openKey, color='var(--sec)', minH=190){

  const rtl=document.documentElement.dir==='rtl', bw=(W-pad.l-pad.r)/n, cw=Math.min(48,bw*.58);
  const cx=i=>{ const c=pad.l+bw*i+bw/2; return rtl?W-c:c; }, y=v=>pad.t+(1-v/max)*(H-pad.t-pad.b), base=H-pad.b;

/* stock report: in Odoo the filters, search and paging run on the server (stock.quant grouped by product and warehouse) */
function renderStock(){
  const host=$('#stockHost'); if(!host) return; const s=state.stock, q=s.q.trim().toLowerCase();
  const rows=stock.filter(r=>(!s.wh||r.wh===s.wh)&&(!s.cat||r.cat===s.cat)&&(!q||r.name.toLowerCase().includes(q)||r.ref.toLowerCase().includes(q))&&(!s.hide||r.oh>0));
  const per=10, pages=Math.max(1,Math.ceil(rows.length/per)); s.page=Math.min(s.page,pages-1); const view=rows.slice(s.page*per,s.page*per+per);
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig') : null, hl = str => re ? esc(str).replace(re,m=>`<mark>${m}</mark>`) : esc(str);
  const total=rows.reduce((a,r)=>a+r.oh*r.cost,0);
  host.innerHTML = `<div class="filters">
      <select class="field" id="fWh" aria-label="${esc(t('Warehouse'))}"><option value="">${esc(t('All warehouses'))}</option>${WH.map(w=>`<option ${s.wh===w?'selected':''}>${w}</option>`).join('')}</select>
      <select class="field" id="fCat" aria-label="${esc(t('Category'))}"><option value="">${esc(t('All categories'))}</option>${CATS.map(c=>`<option ${s.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <input class="field grow" id="fQ" type="search" placeholder="${esc(t('Search product name or internal reference'))}" value="${esc(s.q)}">
      <label class="custom"><input type="checkbox" id="fHide" ${s.hide?'checked':''}> ${esc(t('Hide zero and negative stock'))}</label></div>
    ${view.length ? table([{t:'Reference',i:'ref',f:v=>hl(v)},{t:'Product',i:'name',f:(v,r)=>`${hl(v)}<small>${esc(r.cat)}</small>`},{t:'Warehouse',i:'wh'},{t:'On hand',i:'oh',n:1,f:v=>N(v),cls:v=>v<=0?'neg':''},{t:'Reserved',i:'res',n:1,f:v=>N(v)},{t:'Available',i:'oh',n:1,f:(v,r)=>N(r.oh-r.res),cls:(v,r)=>r.oh-r.res<=0?'neg':''},{t:'Unit',i:'unit'},{t:'Value',i:'oh',n:1,f:(v,r)=>N(r.oh*r.cost)}],view,r=>'product:'+r.ref,
      `<tfoot><tr><td colspan="7">${t('Total')} · ${rows.length} ${t('lines')}</td><td class="n num">${N(total)}</td></tr></tfoot>`) : `<p class="note">${t('No matches.')}</p>`}
    <div class="pager"><span class="num">${rows.length? s.page*per+1:0}–${Math.min(rows.length,s.page*per+per)} / ${rows.length}</span><div><button class="btn" id="pPrev" ${s.page===0?'disabled':''}>${t('Previous')}</button><button class="btn" id="pNext" ${s.page>=pages-1?'disabled':''}>${t('Next')}</button></div></div>`;
  $('#fWh').onchange=e=>{s.wh=e.target.value;s.page=0;renderStock();};
  $('#fCat').onchange=e=>{s.cat=e.target.value;s.page=0;renderStock();};
  $('#fHide').onchange=e=>{s.hide=e.target.checked;s.page=0;renderStock();};
  let tm; $('#fQ').oninput=e=>{clearTimeout(tm); tm=setTimeout(()=>{s.q=e.target.value;s.page=0;renderStock(); const n=$('#fQ'); n.focus(); n.setSelectionRange(n.value.length,n.value.length);},200);};
  $('#pPrev').onclick=()=>{s.page--;renderStock();}; $('#pNext').onclick=()=>{s.page++;renderStock();};
}

  today:()=>({crumb:'Inventory',title:'Deliveries due today',sub:'9',body:note('Delivery orders scheduled today and not done.'),foot:odoo('Inventory › Deliveries · scheduled today')}),

  attendance:()=>({crumb:'People',title:'Attendance today',sub:'142',body:table([{t:'Employee',i:'name',f:(v,r)=>`<span class="who">${avatar(v)}<span>${esc(v)}<small>${esc(r.dep)}</small></span></span>`},{t:'Check in',i:'inT',n:1,f:v=>v||'—'},{t:'Check out',i:'outT',n:1,f:v=>v||'—'},{t:'Status',i:'st',f:(v,r)=>attChip(r)}],employees,r=>'emp:'+r.name),foot:odoo('Attendances › Attendances · today')}),

  shifts:()=>({crumb:'People',title:'Shifts today',sub:'38',body:`<div class="rows">${shifts.map(s=>personRow('emp:'+s[1],s[1],`${s[0]} · ${t(s[3])}`,s[2])).join('')}</div>`,foot:odoo('Planning › Schedule · today')}),

/* whole-database search (example index; in Odoo one server call, 5 results per model) */
const INDEX = [
  ...orders.map(o=>['Sales orders',o[0],o[1],'so:'+o[0]]), ['Sales orders','S01877','Canal Motors · Mar 2026','orders'], ['Sales orders','S00942','Sinai Build Co. · 2025','orders'],
  ['Invoices','INV/2026/01412','Delta Home Stores','invoices'],['Invoices','INV/2025/03310','Luxor Hotels Group','invoices'],['Vendor bills','BILL/2026/00877','Aswan Steel Works','payExp'],
  ...poApprove.map(p=>['Purchase orders',p[0],p[1],'po:'+p[0]]),['Purchase orders','P00412','Nile Paper Mills · 2025','po'],
  ...lateDel.map(d=>['Transfers',d[0],d[1],'picking:'+d[0]]),...lateReceipts.map(d=>['Transfers',d[0],d[1],'picking:'+d[0]]),
  ...productsBase.map(p=>['Products',p[1],p[0],'product:'+p[0]]),
  ...['Luxor Hotels Group','Delta Home Stores','Cairo Office Supply','Red Sea Marine','Sinai Build Co.','Giza Pharma Distribution','Nile Valley Foods','Alex Port Logistics','Mansoura Retail','Canal Motors','Upper Egypt Agro','Aswan Steel Works','Horus Electrical','Delta Plastics'].map(c=>['Contacts',c,'Company','partner:'+c]),
  ...opps.map(o=>['Opportunities',o[0],o[1],'opp:'+o[0]]), ...employees.map(e=>['Employees',e.name,`${e.job} · ${e.dep}`,'emp:'+e.name])];
function searchRender(q){
  const s=q.trim().toLowerCase(), box=$('#qres'); if(!box) return;
  if(s.length<2){ box.innerHTML=`<p class="note">${t('Type at least 2 characters.')}</p>`; return; }
  const groups={}; INDEX.filter(r=>(r[1]+' '+r[2]).toLowerCase().includes(s)).forEach(r=>{ (groups[r[0]]=groups[r[0]]||[]).push(r); });
  const re=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), hl=x=>esc(x).replace(re,m=>`<mark>${m}</mark>`);
  box.innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([g,rs])=>`<div class="group-label"><span>${g}</span><span>${rs.length>5?'5 / '+rs.length:rs.length}</span></div><div class="rows">${rs.slice(0,5).map(r=>`<div class="row click" data-open="${esc(r[3])}"><span class="l"><span>${hl(r[1])}<small>${hl(r[2])}</small></span></span></div>`).join('')}</div>`).join('') : `<p class="note">${t('No matches.')}</p>`;
}

const drawer=$('#drawer'), scrim=$('#scrim'); let lastFocus=null;
const SEC_OF = {Finance:'finance','Bank & Cash':'finance',Sales:'sales',CRM:'crm',Procurement:'procurement',Inventory:'inventory',People:'people',Product:'inventory',Transfer:'inventory',Contact:'sales'};
function openDrawer(spec){
  const i=spec.indexOf(':'), key=i<0?spec:spec.slice(0,i), arg=i<0?undefined:spec.slice(i+1); const f=D[key]; if(!f) return;
  const d=f(arg);
  drawer.dataset.sec = SEC_OF[d.crumb] || (d.crumb||'').startsWith('Sales') && 'sales' || state.page;
  $('#dCrumb').innerHTML = (d.back?`<button data-open="${d.back}">${lang==='ar'?'→':'←'} ${t('Back')}</button>`:'') + `<span>${esc(t(d.crumb))}</span>`;
  $('#dTitle').textContent=t(d.title); $('#dSub').textContent=d.sub||'';
  $('#dBody').innerHTML=d.body; $('#dFoot').innerHTML=d.foot||''; $('#dFoot').hidden=!d.foot;
  if(!drawer.classList.contains('on')) lastFocus=document.activeElement;
  drawer.classList.add('on'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  const ch=$('[data-line="drawer"]',drawer); if(ch) lineChart(ch,[{name:'Revenue',v:revenue,c:'var(--s1)',area:true},{name:'Net profit',v:profit,c:'var(--s2)'}],200);
  if(key==='search'){ const q=$('#q'); q.focus(); let tm; q.addEventListener('input',()=>{clearTimeout(tm); tm=setTimeout(()=>searchRender(q.value),150);}); } else $('#dClose').focus();
  $('#dBody').scrollTop=0;
}
function closeDrawer(){ if(!drawer.classList.contains('on')) return; drawer.classList.remove('on'); scrim.classList.remove('on'); drawer.setAttribute('aria-hidden','true'); lastFocus?.focus?.(); }
let toastT; const toast=m=>{ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),3200); };

/* ---------- render ---------- */
const loaded = new Set(['welcome']);
function drawCharts(){
  $$('[data-line="fin"]').forEach(h=>lineChart(h,[{name:'Revenue',v:revenue,c:'var(--s1)',area:true},{name:'Net profit',v:profit,c:'var(--s2)'}]));
  $$('[data-line="sales"]').forEach(h=>lineChart(h,[{name:'Invoiced sales',v:revenue,c:'var(--c-sal)',area:true}]));
  $$('[data-col="recv"]').forEach(h=>columnChart(h,recvExp.map((d,i)=>[d[0],d[1],i?null:'var(--crit)']),'recvExp'));
  $$('[data-col="pay"]').forEach(h=>columnChart(h,payExp.map((d,i)=>[d[0],d[1],i?null:'var(--crit)']),'payExp'));
  $$('[data-col="stages"]').forEach(h=>columnChart(h,stages.map(s=>[s[0],s[2]]),'pipeline','var(--sec)',170));
  $$('[data-col="purch"]').forEach(h=>columnChart(h,purchases,'po','var(--sec)',220));
}
function fillWidgets(){ drawCharts(); renderStock(); renderEmp(); }
function render(){
  const root=document.documentElement; root.lang = lang; root.dir = lang==='ar'?'rtl':'ltr'; root.dataset.sec = state.page;
  $$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  const lab=(el,s)=>{ el.title=t(s); el.setAttribute('aria-label',t(s)); };
  lab($('#homeBtn'),'Hide figures and return to Welcome'); lab($('#themeBtn'),"Switch theme (in Odoo: the user's dark mode setting)"); lab($('#dClose'),'Close');
  lab($('#tbSearch'),'Search'); lab($('#tbAtt'),'Needs attention'); lab($('#langBtn'),'Preview Arabic / English');
  const navHtml = cls => SECTIONS.map(s=>`<button class="${cls}" data-sec="${s[0]}" data-page="${s[0]}" title="${esc(t(s[1]))}" ${state.page===s[0]?'aria-current="page"':''}><span class="ic">${svgI(s[0])}</span><span class="lbl">${esc(t(s[1]))}</span></button>`).join('');
  $('#nav').innerHTML = navHtml('nav-btn'); $('#mnav').innerHTML = navHtml('');
  $('#periodSeg').innerHTML = Object.entries(PERIODS).map(([k,p])=>`<button data-p="${k}" aria-pressed="${state.period===k}">${esc(t(p[0]))}</button>`).join('');
  const noP = NO_PERIOD.includes(state.page), welcome = state.page==='welcome';
  $('#periodSeg').hidden = noP; $('#customRange').hidden = noP || state.period!=='custom'; $('#homeBtn').hidden = welcome;
  const sec = SECTIONS.find(s=>s[0]===state.page);
  $('#titleIc').innerHTML = svgI(state.page);
  $('#pageTitle').textContent = welcome ? t('Executive Dashboard') : t(sec[1]);
  $('#pageSub').innerHTML = welcome ? '<bdi>Example Trading Co.</bdi>' : noP ? esc(t('as of today')) : `<bdi dir="ltr">${esc(periodLabel())}</bdi>`;
  document.documentElement.style.setProperty('--tbh', $('#topbar').offsetHeight+'px');
  const c=$('#content');
  c.innerHTML = pages[state.page]() + (welcome?'':`<p class="example-note">${esc(t('Example data. Every figure opens a side panel; “Open in Odoo” names the native screen.'))}</p>`);
  const cur = $('#mnav [aria-current]'); if(cur) cur.scrollIntoView({block:'nearest',inline:'center'});
  if(!loaded.has(state.page)){
    // First visit: the frame shows at once and each widget fills in on its own, as each Odoo widget loads independently.
    loaded.add(state.page);
    const parts=$$('.kpi, .panel',c);
    parts.forEach(el=>{ const h=el.innerHTML; el.style.minHeight=Math.max(80,Math.min(el.offsetHeight,340))+'px'; el.innerHTML='<div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:26px;width:70%"></div>';
      el._fill=()=>{ el.innerHTML=h; el.style.minHeight=''; }; });
    parts.forEach((el,i)=>setTimeout(()=>{ el._fill(); if(i===parts.length-1) fillWidgets(); else if($('#stockHost,#empHost',el)) { renderStock(); renderEmp(); } }, 80+i*35));
  } else fillWidgets();
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'); if(go){ toast((lang==='ar'?'في أودو يفتح: ':'In Odoo this opens: ')+go.dataset.go); return; }
  const pg=e.target.closest('[data-page]'); if(pg){ state.page=pg.dataset.page; closeDrawer(); render(); scrollTo({top:0}); return; }
  const p=e.target.closest('[data-p]'); if(p){ state.period=p.dataset.p; render(); return; }
  const ar=e.target.closest('[data-ar]'); if(ar){ const [k,v]=ar.dataset.ar.split(':'); state.ar[k]=v; render(); return; }
  const at=e.target.closest('[data-att]'); if(at){ const [pg2,key]=at.dataset.att.split(':'); state.page=pg2; render(); openDrawer(key); return; }
  const op=e.target.closest('[data-open]'); if(op){ openDrawer(op.dataset.open); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('g.col-hit')) openDrawer(e.target.dataset.open);
  if(e.key==='Escape') closeDrawer();
  if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openDrawer('search'); }
  if(e.key==='Tab' && drawer.classList.contains('on')){ const f=$$('button,input,[tabindex]:not([tabindex="-1"])',drawer).filter(x=>!x.closest('[hidden]')); if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
$('#dClose').onclick=closeDrawer; scrim.onclick=closeDrawer;
$('#homeBtn').onclick=()=>{ state.page='welcome'; closeDrawer(); render(); };
$('#dFrom').onchange=$('#dTo').onchange=()=>render();
const setLang = v => { lang=v; $('#lang').value=v; closeDrawer(); render(); };
$('#lang').onchange=e=>setLang(e.target.value);
$('#langBtn').onclick=()=>setLang(lang==='ar'?'en':'ar');
$('#themeBtn').onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; };
let rz, lastW=innerWidth; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ document.documentElement.style.setProperty('--tbh', $('#topbar').offsetHeight+'px'); if(innerWidth!==lastW){ lastW=innerWidth; drawCharts(); } },120); });
render();
})();
</script>
