<title>Executive Dashboard Concept</title>
<meta name="description" content="Reference design for the Executive Dashboard for Odoo: welcome screen, six sections, side-panel detail. Example data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f4f7; --panel:#ffffff; --soft:#f9f8fa; --ink:#1d1b22; --muted:#625d6b; --faint:#8b8594;
  --line:#e6e3ea; --line-strong:#d3cfd9;
  --brand:#714b67; --brand-ink:#ffffff; --brand-tint:#f3ecf1; --brand-hover:#5c3b53;
  --good:#1d7a4f; --good-soft:#e8f4ee; --warn:#9a5b00; --warn-soft:#fdf1dc; --crit:#b3303a; --crit-soft:#fbe9eb;
  --s1:#2a78d6; --s2:#eb6834;
  --a1:#86b6ef; --a2:#5598e7; --a3:#2a78d6; --a4:#1c5cab; --a5:#104281;
  --shadow:0 18px 50px rgba(29,27,34,.16); --scrim:rgba(29,27,34,.28);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
    --line:#302d37; --line-strong:#423e4a;
    --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-tint:#34283a; --brand-hover:#e4c5dd;
    --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630;
    --s1:#3987e5; --s2:#d95926;
    --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
    --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131217; --panel:#1d1b23; --soft:#23212a; --ink:#f1eff4; --muted:#aca6b5; --faint:#86808f;
  --line:#302d37; --line-strong:#423e4a;
  --brand:#d5a9cb; --brand-ink:#1d1b22; --brand-tint:#34283a; --brand-hover:#e4c5dd;
  --good:#7fd1a6; --good-soft:#1f3a2e; --warn:#f3c26b; --warn-soft:#3a3122; --crit:#ff9ea8; --crit-soft:#402630;
  --s1:#3987e5; --s2:#d95926;
  --a1:#184f95; --a2:#256abf; --a3:#3987e5; --a4:#6da7ec; --a5:#9ec5f4;
  --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:36px;height:36px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}
.brand strong{display:block;font-size:14px;line-height:1.25}
.brand small{color:var(--muted);font-size:12px}
.rail-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;margin:0}
:lang(ar) .rail-label,:lang(ar) .group-label,:lang(ar) th{letter-spacing:0}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--brand-tint);color:var(--brand)}
.nav-btn .count{margin-inline-start:auto;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
.nav-btn kbd{margin-inline-start:auto;font:11px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);color:var(--faint);font-size:12px;display:flex;flex-direction:column;gap:8px}
.rail-foot label{display:flex;flex-direction:column;gap:4px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.topbar h1{font-size:20px;margin:0;font-weight:600;margin-inline-end:auto;line-height:1.25}
.topbar h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.custom{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.field{background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--ink);min-width:0}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn svg{width:17px;height:17px}
.menu-toggle{display:none}

.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:20px}
.example-note{font-size:12px;color:var(--faint);margin:0}

/* welcome */
.welcome{max-width:1040px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:26px;padding-block:24px}
.hello{display:flex;flex-direction:column;gap:6px}
.hello .date{color:var(--muted);font-size:14px;margin:0}
.hello h2{font-size:34px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.search-launch{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;border:1px solid var(--line-strong);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:text;color:var(--faint);text-align:start}
.search-launch kbd{margin-inline-start:auto;font:11px var(--font);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--brand);box-shadow:0 8px 24px rgba(29,27,34,.08);transform:translateY(-1px)}
.card .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center}
.card .ic svg{width:21px;height:21px}
.card h3{margin:0;font-size:16px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:13px}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.card li{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:var(--line-strong);box-shadow:0 4px 14px rgba(29,27,34,.06)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500}
.kpi-value{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.kpi-cap{font-size:12px;color:var(--faint)}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:15px;margin:0;font-weight:600}
.panel-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link:hover{text-decoration:underline}
.link svg{width:14px;height:14px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.big{font-size:28px;font-weight:600}
.big small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* skeleton */
.sk{border-radius:8px;background:linear-gradient(90deg,var(--soft) 0,var(--line) 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* charts */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.axis text{fill:var(--faint);font-size:11px;font-family:var(--font)}
.vlabel{fill:var(--muted);font-size:11px;font-weight:600;font-family:var(--font)}
.xlabel{fill:var(--faint);font-size:11px;font-family:var(--font)}
.grid-line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
.col-hit{cursor:pointer}
.col-hit:hover path{filter:brightness(1.1)}

/* rows & tables */
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0;display:flex;align-items:center;gap:10px}
.row .l > span{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:12px}
.row .r{font-weight:600;white-space:nowrap;text-align:end}
.row .r small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row.click{cursor:pointer;border-radius:8px;padding-inline:8px;margin-inline:-8px}
.row.click:hover{background:var(--soft)}
.rank{width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);flex:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.who{display:flex;gap:10px;align-items:center}
.total-row{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line-strong);font-weight:600}
.group-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 0 0;display:flex;justify-content:space-between}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:end}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--soft)}
td small{display:block;color:var(--muted);font-size:12px}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;border:0;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.good{background:var(--good-soft);color:var(--good)}.chip.info{background:var(--brand-tint);color:var(--brand)}.chip.neutral{background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .grow{flex:1 1 220px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager div{display:flex;gap:6px}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--line-strong)}
.tile b{font-size:22px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tile.crit b{color:var(--crit)} .tile.warn b{color:var(--warn)}

/* aging */
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}
.stack button{border:0;padding:0;cursor:pointer;min-width:3px}
.stack button:hover{filter:brightness(1.1)}
.age-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.age-legend button{border:0;background:none;text-align:start;padding:4px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.age-legend button:hover{background:var(--soft)}
.age-legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.age-legend span i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.age-legend b{font-size:13px;font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);background:var(--panel);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding-top:env(safe-area-inset-top,0px)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none!important;visibility:visible;transition:transform .22s ease}
.drawer-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-head > div{flex:1;min-width:0}
.crumb{font-size:12px;color:var(--faint);margin:0 0 2px;display:flex;gap:8px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--brand);cursor:pointer;font-size:12px;font-weight:600}
.drawer-head h2{margin:0;font-size:18px;font-weight:600}
.drawer-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.drawer-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer-foot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dest{font-size:12px;color:var(--muted);flex-basis:100%}
.search-input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font-size:15px;background:var(--soft);color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}
.def dt{font-weight:600;margin-top:10px}
.def dd{margin:2px 0 0;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
mark{background:var(--brand-tint);color:inherit;border-radius:3px;padding:0 1px}
.sev{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.sev.crit{background:var(--crit-soft);color:var(--crit)} .sev.warn{background:var(--warn-soft);color:var(--warn)} .sev.info{background:var(--brand-tint);color:var(--brand)}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;width:100%;border:0;background:none;padding:10px 8px;border-radius:10px;cursor:pointer;text-align:start}
.att:hover{background:var(--soft)}
.att b{display:block;font-weight:500;margin-top:4px}
.att small{font-size:12px;color:var(--muted)}
.att .amt{font-weight:600;white-space:nowrap}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  [dir="rtl"] .rail{transform:translateX(105%)}
  .rail.on{transform:none!important}
  .menu-toggle{display:inline-grid}
  .topbar{padding:10px 16px}
  .content{padding:16px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:1fr}
  .age-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hello h2{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail" id="rail" aria-label="Navigation">
    <div class="brand"><div class="brand-mark">ET</div><div><strong><bdi>Example Trading Co.</bdi></strong><small data-t="Executive Dashboard"></small></div></div>
    <p class="rail-label" data-t="Sections"></p>
    <nav id="nav"></nav>
    <p class="rail-label" data-t="Quick access"></p>

function lineChart(host, series, h=260){
  const W = Math.max(280, host.clientWidth), H=h, pad={l:44,r:14,t:10,b:26};
  const max = Math.ceil(Math.max(...series.flatMap(s=>s.v))/5e6)*5e6;
  const rtl = document.documentElement.dir==='rtl';
  const x0 = i => pad.l + i*(W-pad.l-pad.r)/(months.length-1), X = i => rtl ? W - x0(i) : x0(i), y = v => pad.t + (1-v/max)*(H-pad.t-pad.b);
  const n = months.length-1;
  let g=''; for (let v=0; v<=max; v+=5e6) g+=`<line class="grid-line" x1="${rtl?pad.r:pad.l}" x2="${rtl?W-pad.l:W-pad.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${rtl?W-pad.l+8:pad.l-8}" y="${y(v)+4}" text-anchor="${rtl?'start':'end'}">${v/1e6}M</text>`;
  const xl = months.map((m,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${m}</text>`).join('');
  const lines = series.map(s=>{ const p=s.v.slice(0,-1).map((v,i)=>(i?'L':'M')+X(i)+' '+y(v)).join('');
    const area = s.area?`<path d="${p}L${X(n)} ${y(s.v[n])}L${X(n)} ${y(0)}L${X(0)} ${y(0)}Z" fill="var(${s.c})" opacity=".08"/>`:'';
    return `${area}<path d="${p}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round"/><path d="M${X(n-1)} ${y(s.v[n-1])}L${X(n)} ${y(s.v[n])}" stroke="var(${s.c})" stroke-width="2" stroke-dasharray="4 4" fill="none"/><circle cx="${X(n)}" cy="${y(s.v[n])}" r="4" fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>`; }).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Monthly trend"><g class="axis">${g}${xl}</g>${lines}<line class="xh" y1="${pad.t}" y2="${H-pad.b}" stroke="var(--line-strong)" visibility="hidden"/><g class="dots"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg=$('svg',host), tip=$('.tip',host), xh=$('.xh',svg), dots=$('.dots',svg);
  const show=i=>{ xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('visibility','visible');
    dots.innerHTML=series.map(s=>`<circle cx="${X(i)}" cy="${y(s.v[i])}" r="4" fill="var(${s.c})" stroke="var(--panel)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<b>${months[i]} ${i<3?2025:2026}${i===n?' · 1–25':''}</b>`+series.map(s=>`<div><span><i style="background:var(${s.c})"></i>${esc(t(s.name))}</span><span class="num">${M(s.v[i])}</span></div>`).join('');
    tip.hidden=false; const px=X(i); tip.style.left=(px>W/2? px-176 : px+14)+'px'; tip.style.top='6px'; };
  $('.hit',svg).addEventListener('pointermove',e=>{ const r=svg.getBoundingClientRect(); let px=(e.clientX-r.left)*W/r.width; if(rtl) px=W-px; show(Math.max(0,Math.min(n,Math.round((px-pad.l)/((W-pad.l-pad.r)/n))))); });
  $('.hit',svg).addEventListener('pointerleave',()=>{ xh.setAttribute('visibility','hidden'); dots.innerHTML=''; tip.hidden=true; });
}
function columnChart(host, data, openKey){
  const W=Math.max(260,host.clientWidth), H=190, pad={l:8,r:8,t:22,b:26}, n=data.length, max=Math.max(...data.map(d=>d[1]))*1.1;
  const rtl=document.documentElement.dir==='rtl', bw=(W-pad.l-pad.r)/n, cw=Math.min(46,bw*.56);
  const cx=i=>{ const c=pad.l+bw*i+bw/2; return rtl?W-c:c; }, y=v=>pad.t+(1-v/max)*(H-pad.t-pad.b), base=H-pad.b;
  const cols=data.map((d,i)=>{ const top=y(d[1]), r=Math.min(4,(base-top)/2), a=cx(i)-cw/2;
    const path=`M${a} ${base}V${top+r}Q${a} ${top} ${a+r} ${top}H${a+cw-r}Q${a+cw} ${top} ${a+cw} ${top+r}V${base}Z`;
    return `<g class="col-hit" data-open="${openKey}" tabindex="0" role="button" aria-label="${esc(t(d[0]))}: ${M(d[1])}"><rect x="${cx(i)-bw/2}" y="${pad.t}" width="${bw}" height="${base-pad.t}" fill="transparent"/><path d="${path}" fill="${d[2]||'var(--s1)'}"/><text class="vlabel num" x="${cx(i)}" y="${top-6}" text-anchor="middle">${M(d[1])}</text><text class="xlabel" x="${cx(i)}" y="${H-8}" text-anchor="middle">${esc(t(d[0]))}</text></g>`; }).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img"><line class="grid-line" x1="${pad.l}" x2="${W-pad.r}" y1="${base}" y2="${base}"/>${cols}</svg>`;
}

/* stock report: in Odoo the filters, search and paging run on the server */
function renderStock(){
  const host=$('#stockHost'); if(!host) return; const s=state.stock, q=s.q.trim().toLowerCase();
  const rows=stock.filter(r=>(!s.wh||r.wh===s.wh)&&(!s.cat||r.cat===s.cat)&&(!q||r.name.toLowerCase().includes(q)||r.ref.toLowerCase().includes(q))&&(!s.zero||r.oh>0));
  const per=10, pages=Math.max(1,Math.ceil(rows.length/per)); s.page=Math.min(s.page,pages-1); const view=rows.slice(s.page*per,s.page*per+per);
  const re = q ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig') : null, hl = str => re ? esc(str).replace(re,m=>`<mark>${m}</mark>`) : esc(str);
  const total=rows.reduce((a,r)=>a+r.oh*r.cost,0);
  host.innerHTML = `<div class="filters">
      <select class="field" id="fWh" aria-label="${esc(t('Warehouse'))}"><option value="">${esc(t('All warehouses'))}</option>${WH.map(w=>`<option ${s.wh===w?'selected':''}>${w}</option>`).join('')}</select>
      <select class="field" id="fCat" aria-label="${esc(t('Category'))}"><option value="">${esc(t('All categories'))}</option>${CATS.map(c=>`<option ${s.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <input class="field grow" id="fQ" type="search" placeholder="${esc(t('Search product name or internal reference'))}" value="${esc(s.q)}">
      <label class="custom"><input type="checkbox" id="fZero" ${s.zero?'checked':''}> ${esc(t('Hide zero stock'))}</label></div>

function searchRender(q){
  const s=q.trim().toLowerCase(), box=$('#qres'); if(!box) return;
  if(s.length<2){ box.innerHTML=`<p class="note">${t('Type at least 2 characters.')}</p>`; return; }
  const groups={}; INDEX.filter(r=>(r[1]+' '+r[2]).toLowerCase().includes(s)).forEach(r=>{ (groups[r[0]]=groups[r[0]]||[]).push(r); });
  const re=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), hl=x=>esc(x).replace(re,m=>`<mark>${m}</mark>`);
  box.innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([g,rs])=>`<div class="group-label"><span>${g}</span><span>${rs.length>5?'5 / '+rs.length:rs.length}</span></div><div class="rows">${rs.slice(0,5).map(r=>`<div class="row click" data-open="${esc(r[3])}"><span class="l"><span>${hl(r[1])}<small>${hl(r[2])}</small></span></span></div>`).join('')}</div>`).join('') : `<p class="note">${t('No matches.')}</p>`;
}

    parts.forEach(el=>{ const h=el.innerHTML; el.style.minHeight=Math.max(92,Math.min(el.offsetHeight,340))+'px'; el.innerHTML='<div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:26px;width:70%"></div>';
      el._fill=()=>{ el.innerHTML=h; el.style.minHeight=''; }; });
    parts.forEach((el,i)=>setTimeout(()=>{ el._fill(); if($('[data-line],[data-col],#stockHost,#empHost',el)) fillWidgets(); }, 90+i*40));
  } else fillWidgets();
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]'); if(go){ toast((lang==='ar'?'في أودو يفتح: ':'In Odoo this opens: ')+go.dataset.go); return; }
  const pg=e.target.closest('[data-page]'); if(pg){ state.page=pg.dataset.page; closeRail(); closeDrawer(); render(); scrollTo({top:0}); return; }
  const p=e.target.closest('[data-p]'); if(p){ state.period=p.dataset.p; render(); return; }
  const ar=e.target.closest('[data-ar]'); if(ar){ const [k,v]=ar.dataset.ar.split(':'); state.ar[k]=v; render(); return; }
  const at=e.target.closest('[data-att]'); if(at){ const [pg2,key]=at.dataset.att.split(':'); state.page=pg2; render(); openDrawer(key); return; }
  const op=e.target.closest('[data-open]'); if(op){ closeRail(); openDrawer(op.dataset.open); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches && e.target.matches('g.col-hit')) openDrawer(e.target.dataset.open);
  if(e.key==='Escape') closeDrawer();
  if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openDrawer('search'); }
  if(e.key==='Tab' && drawer.classList.contains('on')){ const f=$$('button,input,[tabindex]:not([tabindex="-1"])',drawer).filter(x=>!x.closest('[hidden]')); if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
$('#dClose').onclick=closeDrawer; scrim.onclick=closeDrawer;
$('#homeBtn').onclick=()=>{ state.page='welcome'; closeDrawer(); render(); };
$('#dFrom').onchange=$('#dTo').onchange=()=>render();
$('#lang').onchange=e=>{ lang=e.target.value; closeDrawer(); render(); };
$('#themeBtn').onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; };
const rail=$('#rail'), menuBtn=$('#menuBtn');
function closeRail(){ rail.classList.remove('on'); menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.onclick=()=>{ const on=!rail.classList.contains('on'); rail.classList.toggle('on',on); menuBtn.setAttribute('aria-expanded',on); };
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(drawCharts,120); });
render();
})();
</script>
