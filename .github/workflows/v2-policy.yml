# Fast, deterministic V2 policy gate.  It has no Odoo database and no Shopify
# credentials; expensive install/update/browser/concurrency runs remain in the
# connector-suite workflow and are triggered only by published coherent chunks.

name: V2 policy and compatibility

on:
  push:
    branches-ignore:
      - main
      - Shopify-connector
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Static contracts and frozen V1 surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: addons/requirements.txt

      - name: Install GraphQL validator dependency
        run: python -m pip install -r addons/requirements.txt

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"

      - name: Run P00 analyzer unit tests
        run: python -m unittest tools.tests.test_v2_repository_baseline -v

      - name: Check frozen compatibility artifacts
        run: python tools/v2_repository_baseline.py --source-ref HEAD --check

      - name: Validate Shopify GraphQL documents
        run: python tools/validate_shopify_graphql.py

      - name: Compile analysis tools
        run: python -m py_compile tools/v2_repository_baseline.py tools/validate_shopify_graphql.py

      - name: Check patch whitespace
        run: git diff --check HEAD^
