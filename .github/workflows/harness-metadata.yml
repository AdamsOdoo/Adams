name: Harness connection metadata
on:
  push:
    paths: ['.odoo-harness/connection.json', 'scripts/work-harness.py', 'tests/test_work_harness.py', '.github/workflows/harness-metadata.yml']
  pull_request:
    paths: ['.odoo-harness/connection.json', 'scripts/work-harness.py', 'tests/test_work_harness.py', '.github/workflows/harness-metadata.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check public connection metadata (not Odoo testing)
        run: python3 scripts/work-harness.py check --metadata-only
      - name: Reject candidate-identity overrides
        run: python3 -m unittest discover -s tests -p test_work_harness.py -v
