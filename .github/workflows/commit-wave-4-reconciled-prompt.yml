name: Commit reconciled Wave 4 Gate A prompt

on:
  pull_request:
    branches:
      - mvp/program-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-reconciled-prompt:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'control-room/wave-4-gate-a-prompt-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-room/wave-4-gate-a-prompt-review
          fetch-depth: 0

      - name: Execute reconciler embedded in reviewed workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/reconcile-wave-4-gate-a-prompt-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          source = textwrap.dedent('\n'.join(workflow[start:end]))
          exec(compile(source, 'embedded-reconciler', 'exec'), {})
          PY

      - name: Verify and commit documentation-only result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git diff --name-only -- addons)"
          test "$(git diff --name-only | tr '\n' ' ')" = "docs/06-prompts/wave-4-gate-a-codex-review-candidate.md "
          git config user.name 'ChatGPT Control Room'
          git config user.email 'control-room@users.noreply.github.com'
          git add docs/06-prompts/wave-4-gate-a-codex-review-candidate.md
          git commit -m 'Docs: reconcile and lock Wave 4 Gate A Codex prompt'
          git push origin HEAD:control-room/wave-4-gate-a-prompt-review
