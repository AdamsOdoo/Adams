name: Task 013 Track B exact import

on:
  pull_request:
    branches:
      - 'mvp/program-integration'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-exact-tested-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify, and import exact runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .control-room/task-013-track-b/part00 \
            .control-room/task-013-track-b/part01 \
            .control-room/task-013-track-b/part02 \
            .control-room/task-013-track-b/part03 \
            .control-room/task-013-track-b/part04a \
            .control-room/task-013-track-b/part04b \
            .control-room/task-013-track-b/part04c \
            .control-room/task-013-track-b/part04d \
            .control-room/task-013-track-b/part05 \
            .control-room/task-013-track-b/part06 \
            .control-room/task-013-track-b/part07 \
            .control-room/task-013-track-b/part08 \
            > /tmp/track-b.bundle.b64
          test "$(wc -c < /tmp/track-b.bundle.b64)" = "34824"
          base64 --decode /tmp/track-b.bundle.b64 > /tmp/track-b.bundle
          test "$(stat -c %s /tmp/track-b.bundle)" = "26116"
          echo '92cc3272e7821a57029d0415d327e71161ecee74f52110315b106b1769c4e44e  /tmp/track-b.bundle' | sha256sum --check --strict
          git bundle verify /tmp/track-b.bundle
          git fetch /tmp/track-b.bundle 'refs/heads/claude/wave-3-task-013-2g0ul0:refs/remotes/track-b/candidate'

      - name: Verify exact identity, ancestry, and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='6c221798409555597a432ccfa9959ee621f324ef'
          C1='a700e94f8091793c5595ef87e6126860a8dca4c9'
          C2='973e4e8de6ac26b6c62ef786b4d9a1c2d478da86'
          C3='18ea5d729b6283c5a2af6d04a5285353aacd9ff9'
          TARGET='refs/heads/claude/wave-3-task-013-2g0ul0'

          test "$(git rev-parse refs/remotes/track-b/candidate)" = "$C3"
          test "$(git rev-parse "$C3~3")" = "$BASE"
          printf '%s\n%s\n%s\n' "$C1" "$C2" "$C3" > /tmp/expected-commits
          git rev-list --reverse "$BASE..$C3" > /tmp/actual-commits
          diff -u /tmp/expected-commits /tmp/actual-commits

          cat > /tmp/expected-files <<'EOF'
          addons/shopify_connector_core/tests/test_mutation_source_guards.py
          addons/shopify_connector_inventory/tests/__init__.py
          addons/shopify_connector_inventory/tests/test_inventory_concurrency.py
          docs/01-research/research-handoff.md
          docs/05-qa/architecture-review-log.md
          docs/05-qa/task-013-inventory-sync-validation-results.md
          docs/07-implementation-plan/mvp-program-state.md
          EOF
          git diff --name-only "$BASE..$C3" | sort > /tmp/actual-files
          sort /tmp/expected-files > /tmp/expected-files.sorted
          diff -u /tmp/expected-files.sorted /tmp/actual-files

          REMOTE_HEAD="$(git ls-remote --heads origin "$TARGET" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$BASE"

      - name: Fast-forward PR 182 branch to exact runtime-tested head
        shell: bash
        run: |
          set -euo pipefail
          C3='18ea5d729b6283c5a2af6d04a5285353aacd9ff9'
          TARGET='refs/heads/claude/wave-3-task-013-2g0ul0'
          git push origin "$C3:$TARGET"
          test "$(git ls-remote --heads origin "$TARGET" | awk '{print $1}')" = "$C3"
