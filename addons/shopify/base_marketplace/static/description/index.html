<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Base Marketplace By Qamah Solutions</title>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link href="css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <section class="py-3" style="background-color: #fff;">

            <!-- Set background color-->
            <div class="position-absolute d-none d-lg-block"
                 style="background-color:#f5f5f5; width:100vw; height:100%; margin-left:calc((1080px - 100vw) / 2); margin-top:-30px">
            </div>

            <div class="container">
                <div class="px-md-5 py-md-4 p-2 mb-4 bg-white shadow "
                     style="border-radius: 20px; font-family: 'system-ui';">

                    <div class="position-relative mb-4" style="border-radius: 10px;">
                        <img alt="" class="w-100 h-100 position-absolute img-fluid left_0" loading="lazy"
                             src="img/bg-1.png" style="border-radius: 25px"/>
                        <div class="p-lg-5 p-3 position-relative">
                            <div class="row py-4 py-lg-0">
                                <div class="col-md-12">
                                    <h1 style="font-family: 'system-ui'; font-style: normal; font-weight: bold;word-wrap: break-word; font-size: 48px; line-height: 120%;text-align: center; text-transform: capitalize; font-size: calc(2.06rem + 1vw); ">
                                        <span style="color: #333333; font-size: calc(2.06rem + 1vw);">Base Marketplace</span>
                                    </h1>
                                </div>
                                <div class="col-md-12 py-2">
                                    <p style="font-family: system-ui; font-weight: 500; font-size: 18px; line-height: 150% !important;  text-align: center; letter-spacing: -0.02em; text-indent: 2px; color: #4F4F4F;">
                                        Provide Easy User Interface with Access all Marketplaces at one Screen. Perform all Import/Export Operations
                                        with detailed Statistics.
                                    </p>
                                    <p style="font-family: system-ui; font-weight: 500; font-size: 16px; line-height: 150% !important;  text-align: center; letter-spacing: -0.02em; text-indent: 2px; color: #4F4F4F;">
                                        <strong>Note:</strong> Shared base module for the Qamah Solutions marketplace connectors (installed automatically with the Shopify connector).
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <script src="js/jquery.slim.min.js"></script>
        <script src="js/popper.min.js"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
    </body>

</html>
